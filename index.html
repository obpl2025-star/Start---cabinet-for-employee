<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ЛК стажёра «Старт»</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: dark side rail (role-tinted) + fluid content column, stacks to a top bar on phones */
:root{
  --bg:#F6F3FC;--surface:#FFFFFF;--surface2:#FAF8FE;--line:#E4DDF3;--line2:#EFEAF8;
  --fg:#1D1433;--muted:#5E5575;--faint:#756C8C;
  --accent:#6B2FE0;--accent-fg:#FFFFFF;--accent-soft:#EEE6FF;--accent-ink:#5A22C8;
  --amber:#C7B0FF;--amber-soft:#F2ECFF;--amber-ink:#5A22C8;--on-amber:#1D1433;
  --ok-soft:#E3F4E9;--ok-ink:#1B6E3D;--warn-soft:#FFF1D9;--warn-ink:#8A5300;
  --danger:#B42318;--danger-soft:#FBE4E1;
  --side:#2B0F66;--side-fg:#FFFFFF;--side-muted:#C9BDEB;--side-active:#4320A0;--side-line:#3E2283;
  --slide-bg:#4A1FB8;--slide-fg:#FFFFFF;--slide-muted:#DCD0FA;
  --shadow:0 12px 40px rgba(43,15,102,.14);
  --f-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
body.trainer{--side:#1E0B4A;--side-fg:#FFFFFF;--side-muted:#BFB2E6;--side-active:#3A1C8C;--side-line:#33196F}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 248px;max-width:100%;background:var(--side);color:var(--side-fg);padding-block:28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px}
.brand .mark{width:38px;height:38px;border-radius:11px;background:var(--amber);color:var(--on-amber);font-family:var(--f-display);font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand b{font-family:var(--f-display);font-weight:600;font-size:16px;display:block}
.brand small{font-size:12px;color:var(--side-muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.navlink{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:0 12px;border-radius:10px;border:0;background:transparent;color:var(--side-muted);text-align:left;cursor:pointer;font-size:15px;width:100%}
.navlink:hover{color:var(--side-fg);background:rgba(255,255,255,.04)}
.navlink.on{background:var(--side-active);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--amber)}
.navlink .dot{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.live-tag{font-size:11px;font-weight:700;color:var(--on-amber);background:var(--amber);border-radius:6px;padding:2px 6px}
.me{margin-top:auto;display:flex;align-items:center;gap:12px;padding:14px 10px 0;border-top:1px solid var(--side-line)}
.me .who{flex:1;min-width:0}
.me .who b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .who small{font-size:12px;color:var(--side-muted)}
.me button{background:transparent;border:1px solid var(--side-line);color:var(--side-fg);border-radius:8px;min-height:36px;padding:0 10px;cursor:pointer;font-size:13px}
.ava{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ava.amber{background:var(--amber-soft);color:var(--amber-ink)}
.ava.gray{background:var(--line2);color:var(--muted)}

.main{flex:999 1 560px;min-width:0;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px;padding-inline:clamp(0px,3vw,32px)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.head .t{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:14px;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(24px,3.2vw,32px);letter-spacing:-.01em;line-height:1.15}
h2{font-size:19px;font-weight:600}
h3{font-size:16px;font-weight:600}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}
.small{font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.tight{padding:16px 18px;gap:10px}
.card.dashed{background:var(--surface2);border-style:dashed}
.card.focus{border:2px solid var(--amber)}
.cols{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.cols>.wide{flex:999 1 520px;min-width:0}
.cols>.narrow{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--min,240px),1fr));gap:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:8px;background:var(--line2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.btn.outline{border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:600;cursor:pointer;font-size:14px}

.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.input{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font-size:15px;font-weight:400;width:100%}
.field textarea,textarea.input{padding:12px;resize:vertical;min-height:88px;line-height:1.45}
.err{color:var(--danger);font-size:14px;font-weight:500}

.hero{background:var(--accent);color:var(--accent-fg);border-radius:20px;padding:26px 30px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.hero .big{font-family:var(--f-display);font-weight:600;font-size:clamp(32px,4vw,44px)}
.hero .sub{opacity:.82}
.bars{display:flex;gap:6px}
.bars span{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.18)}
.bars span.done{background:var(--amber)}
.bars span.cur{background:rgba(255,255,255,.55)}
.next{flex:0 1 340px;background:rgba(0,0,0,.18);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line2)}
.li:first-child{border-top:0}
.li .type{width:118px;flex-shrink:0}
.li .ttl{flex:1;min-width:0}
.li .ttl b{font-weight:500;display:block}
.li.locked{color:var(--faint)}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;background:var(--amber-soft);color:var(--amber-ink);border-radius:16px;padding:16px 20px;font-weight:600}
.pulse{width:9px;height:9px;border-radius:50%;background:#C2410C;display:inline-block;margin-right:8px}
.roll-card{max-width:520px;text-align:center;align-items:center;gap:20px}
.roll-card h1{font-size:30px}
.roll-ico{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-ink);font-size:36px}
.roll-ico.ok{background:var(--ok-soft);color:var(--ok-ink)}
.roll-btn{min-height:64px;font-size:19px;padding:0 40px;border-radius:16px}
.rollrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-top:1px solid var(--line2)}
.att{min-width:44px;height:36px;border-radius:10px;border:1px dashed var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;padding:0 10px}
.att.yes{background:var(--ok-soft);color:var(--ok-ink);border:1px solid transparent}
.att.no{background:var(--danger-soft);color:var(--danger);border:1px solid transparent}
.att:hover{border-color:var(--accent)}
.attgrid td,.attgrid th{text-align:center}
.attgrid td:first-child,.attgrid th:first-child{text-align:left}
.attdays{display:flex;flex-wrap:wrap;gap:8px}
.attdays .att{flex-direction:column;height:auto;min-width:64px;padding:6px 10px;gap:2px;font-size:13px}
.attdays .att small{font-weight:500;font-size:11px;opacity:.8}
.pfacts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.pfacts b{color:var(--fg);font-weight:600}
.rmark{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.rmark.yes{background:var(--ok-soft);color:var(--ok-ink)}
.rmark.no{background:var(--danger-soft);color:var(--danger)}
.rmark.wait{background:var(--line2);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.pulse{animation:p 1.6s infinite}@keyframes p{50%{opacity:.35}}}

.day{display:flex;flex-direction:column;gap:14px}
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.daynum{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:600;font-size:18px;background:var(--line2);color:var(--muted);flex-shrink:0}
.daynum.done{background:var(--accent-soft);color:var(--accent-ink)}
.daynum.cur{background:var(--amber);color:var(--on-amber)}
.itemgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.itemcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface);text-align:left;cursor:pointer;color:var(--fg)}
.itemcard:hover{border-color:var(--accent)}
.itemcard.locked{cursor:default;background:var(--surface2);border-style:dashed;color:var(--faint)}
.itemcard.locked:hover{border-color:var(--line)}

.stat{display:flex;flex-direction:column;gap:6px}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:28px}
.meter{height:6px;border-radius:3px;background:var(--line2)}
.meter i{display:block;height:6px;border-radius:3px;background:var(--accent)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px;text-transform:uppercase;letter-spacing:.04em}
td{padding:12px 10px;border-top:1px solid var(--line2);vertical-align:middle}
td:first-child,th:first-child{padding-left:0}

.toggle{flex-shrink:0;width:44px;height:26px;padding:3px;border:0;border-radius:13px;background:var(--line);display:flex;justify-content:flex-start;cursor:pointer}
.toggle i{width:20px;height:20px;border-radius:50%;background:#fff;display:block;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle.on{background:var(--accent);justify-content:flex-end}
.accessday{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.accessday.all{background:var(--accent-soft)}
.accessday.some{background:var(--amber-soft)}
.accessrow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;border-top:1px solid var(--line2);font-size:13px}
.accessrow .ov{font-size:11px;color:var(--amber-ink);font-weight:700}
.seg{display:inline-flex;background:var(--line2);border-radius:12px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{min-height:38px;padding:0 14px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.slide{aspect-ratio:16/9;max-width:100%;background:var(--slide-bg);color:var(--slide-fg);border-radius:20px;padding:clamp(20px,5%,56px) clamp(20px,6%,64px);display:flex;flex-direction:column;gap:clamp(10px,2.4vw,26px);overflow:hidden}
.slide .k{font-size:clamp(11px,1.3vw,15px);font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.06em}
.slide .n{font-family:var(--f-display);font-size:clamp(11px,1.3vw,15px);color:var(--slide-muted)}
.slide h2{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,3.6vw,44px);line-height:1.15;max-width:820px}
.slide ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(6px,1.4vw,16px);font-size:clamp(14px,1.9vw,22px)}
.slide li{display:flex;gap:14px;align-items:baseline}
.slide li::before{content:"";flex-shrink:0;width:.45em;height:.45em;border-radius:3px;background:var(--amber);transform:translateY(-.1em)}
.slide.locked{background:var(--surface2);color:var(--faint);border:1px dashed var(--line);align-items:center;justify-content:center;text-align:center}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.thumb{min-height:74px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer;color:var(--fg)}
.thumb.sel{border:2px solid var(--accent);background:var(--accent-soft)}
.thumb.live{border:2px solid var(--amber)}
.thumb.locked{border-style:dashed;background:var(--surface2);color:var(--faint);cursor:default}
.thumb small{font-size:12px;font-weight:600;color:var(--muted)}
.thumb span{font-size:14px;font-weight:500;line-height:1.3}

.q-opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 16px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:15px}
.q-opt.sel{border:2px solid var(--accent);background:var(--accent-soft)}
.q-opt input{width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}
.qbar{display:flex;gap:4px}
.qbar span{flex:1;height:6px;border-radius:3px;background:var(--line2)}
.qbar span.done{background:var(--accent)}
.qbar span.cur{background:var(--amber)}
.rating{display:flex;gap:6px;flex-wrap:wrap}
.rating label{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:600}
.rating input{position:absolute;opacity:0;pointer-events:none}
.rating label.sel{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.rating.nps label{width:40px}
.q-opt.multi input{border-radius:4px}
.svq{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.svq legend{font-weight:600;margin-bottom:10px;line-height:1.4}
.svq .req{color:var(--danger);margin-left:3px}
.scalebox{display:flex;flex-direction:column;gap:6px;align-self:flex-start;max-width:100%}
.scale-hint{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.svlist .li{flex-wrap:wrap;row-gap:8px}
.svlist .li .ttl{flex:1 1 220px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:500;line-height:1.1}
.bars2{display:flex;flex-direction:column;gap:6px}
.bar2{display:grid;grid-template-columns:minmax(120px,260px) 1fr 70px;gap:10px;align-items:center;font-size:13.5px}
.bar2 .tr{height:10px;border-radius:999px;background:var(--line2);overflow:hidden}
.bar2 .tr i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar2 .c{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.svres{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line2);padding-top:14px}
.texts{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow:auto}
.texts p{margin:0;padding:10px 12px;border-radius:10px;background:var(--surface2);line-height:1.5;white-space:pre-line}
.ansrow td{vertical-align:top}
.ok-ink{color:var(--ok-ink);font-weight:600}
.bad-ink{color:var(--danger);font-weight:600}
td.pct-ok{color:var(--accent-ink);font-weight:600}
td.pct-bad{color:var(--danger);font-weight:600}
@media (max-width:640px){.bar2{grid-template-columns:1fr 60px}.bar2 .tr{grid-column:1 / -1;order:3}}

.kb{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.kb aside{flex:1 1 230px;padding:10px;gap:2px}
.kb .cat{display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;border:0;background:transparent;cursor:pointer;text-align:left;width:100%;font-size:15px}
.kb .cat.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.cheat{background:var(--side);color:#fff;border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
body.trainer .cheat{background:var(--side)}
.cheat .cell{background:rgba(255,255,255,.07);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.cheat .cell .lbl{color:#A9B6B0}
.article{max-width:70ch;display:flex;flex-direction:column;gap:14px}
.article p{margin:0;line-height:1.6}

.tree{overflow-x:auto}
.tree-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px}
.trees{display:flex;flex-direction:column;gap:16px}
.contact-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:25;display:inline-flex;align-items:center;gap:8px;padding:10px 16px 10px 12px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:14px;text-decoration:none;box-shadow:var(--shadow)}
.contact-fab:hover{background:var(--accent-ink)}
body:not(.trainer) .main{padding-bottom:88px}
.contact-fab svg{width:18px;height:18px;flex-shrink:0}
@media (max-width:640px){.contact-fab{right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:10px 14px 10px 12px}}
.tree-in{min-width:640px;display:flex;flex-direction:column;align-items:stretch}
.node{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;text-align:center;background:var(--surface)}
.node.root{align-self:center;width:300px;background:var(--side);color:#fff;border-color:var(--side)}
.node.root .lbl{color:var(--side-muted)}
.node.mine{border:2px solid var(--amber);background:var(--amber-soft)}
.vline{align-self:center;width:2px;height:26px;background:var(--line)}
.kids{display:grid;gap:16px}
.kid{display:flex;flex-direction:column;align-items:center}
.kid .vline{height:22px}
.hline{height:2px;background:var(--line)}

.modal-back{position:fixed;inset:0;background:rgba(10,15,14,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:20}

function testPanel(t){

      '<h2 style="font-family:var(--f-display);font-size:40px" class="num">'+r.pct+'%</h2>'+

      '<p style="margin:0">Правильных ответов: '+r.right+' из '+r.total+'.'+(r.wrong.length?' Ошибки в вопросах: '+r.wrong.join(', ')+'.':'')+'</p>'+
      '<p class="muted small" style="margin:0">Лучший результат: '+((P().tests&&P().tests[t.tid]&&P().tests[t.tid].best)||r.pct)+'%. Осталось попыток: '+Math.max(0,attemptsLeft)+'.</p>'+
      '<div class="row">'+(attemptsLeft>0 && r.pct<100 ? '<button class="btn" type="button" data-act="test-retry">Пройти ещё раз</button>' : '')+'<button class="btn primary" type="button" data-act="test-close">Готово</button></div></section>';
  }

    return '<section class="card" style="flex:999 1 440px;min-width:0"><span class="lbl">Тест</span><h2>'+esc(tt.title)+'</h2>'+
      '<p style="margin:0" class="muted">'+tt.questions.length+' вопросов · проходной балл '+tt.pass+'% · попыток осталось '+Math.max(0,attemptsLeft)+'</p>'+
      (rec ? '<p style="margin:0">Ваш лучший результат: <b class="num">'+rec.best+'%</b>'+(rec.passed?' — тест сдан.':'.')+'</p>' : '')+
      (attemptsLeft>0 ? '<button class="btn primary" style="align-self:flex-start" type="button" data-act="test-start">Начать тест</button>' : '<p class="err" style="margin:0">Попытки закончились. Обратитесь к тренеру.</p>')+

    '<div class="qbar" aria-hidden="true">'+bar+'</div>'+

    '<fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px"><legend class="small muted" style="margin-bottom:10px">Выберите один вариант</legend>'+
    q.options.map(function(o,i){ return '<label class="q-opt'+(sel===i?' sel':'')+'"><input type="radio" name="tq" id="tq-'+t.idx+'-'+i+'" data-act="answer" data-i="'+i+'"'+(sel===i?' checked':'')+'>'+esc(o)+'</label>'; }).join('')+
    '</fieldset>'+
    '<div class="row between"><button class="btn" type="button" data-act="test-prev"'+(t.idx===0?' disabled':'')+'>Назад</button>'+
    (t.idx < tt.questions.length-1 ? '<button class="btn primary" type="button" data-act="test-next"'+(sel==null?' disabled':'')+'>Далее</button>' : '<button class="btn primary" type="button" data-act="test-finish"'+(sel==null?' disabled':'')+'>Завершить тест</button>')+'</div>'+
  '</section>';
}

function internStats(iid){
  var items = allItems(); var done = items.filter(function(i){ return isDone(i, iid); }).length;
  var tests = items.filter(function(i){ return i.type==='test' && i.test; });
  var rs = tests.map(function(i){ return P(iid).tests && P(iid).tests[i.test]; }).filter(Boolean);
  var avg = rs.length ? Math.round(rs.reduce(function(a,r){ return a+r.best; },0)/rs.length) : null;
  var sims = items.filter(function(i){ return i.type==='sim'; });
  var finalIt = tests.filter(function(i){ return i.test==='tf'; })[0] || tests[tests.length-1];
  return {pct: items.length?Math.round(done/items.length*100):0, done:done, total:items.length, avg:avg, testsDone:rs.length, testsTotal:tests.length, simsDone: sims.filter(function(i){ return isDone(i, iid); }).length, simsTotal: sims.length, final: finalIt ? (P(iid).tests && P(iid).tests[finalIt.test]) : null};
}

  var table = list.length ? '<div class="table-wrap"><table><thead><tr><th>Стажёр</th><th>Логин</th><th>Прогресс</th><th>Был в ЛК</th><th><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Действия</span></th></tr></thead><tbody>'+list.map(function(i){
    var st = internStats(i.id); var seen = P(i.id).seen; var on = seen && Date.now()-seen < 120000;
    var del = S.ui.confirmDel===i.id; var sus = !!i.suspended;
    return '<tr'+(sus?' style="opacity:.6"':'')+'><td><b>'+esc(i.name)+'</b>'+(sus?' <span class="chip bad">приостановлен</span>':'')+'</td><td class="muted">'+esc(i.login)+'</td><td class="num">'+st.pct+'%'+(st.avg!=null?' · тесты '+st.avg+'%':'')+'</td><td style="'+(on?'color:var(--accent-ink);font-weight:600':(seen?'':'color:var(--danger);font-weight:600'))+'">'+ago(seen)+'</td><td style="text-align:right;white-space:nowrap">'+

           : '<button class="btn sm" type="button" data-act="intern-suspend" data-id="'+i.id+'" data-on="'+(sus?'0':'1')+'">'+(sus?'Возобновить':'Приостановить')+'</button> <button class="btn sm" type="button" data-act="intern-pw" data-id="'+i.id+'">Новый пароль</button> <button class="btn sm" type="button" data-act="intern-del" data-id="'+i.id+'" aria-label="Удалить '+esc(i.name)+'">Удалить</button>')+'</td></tr>';
  }).join('')+'</tbody></table></div>' : '<div class="empty"><b>В группе пока нет стажёров</b><span>Добавьте первого стажёра в форме справа — система создаст логин и пароль.</span></div>';
  var nameV = f('ni-name'); var loginV = S.form['ni-login'] != null ? S.form['ni-login'] : makeLogin(nameV);
  var form = '<form data-form="newintern" class="card narrow" style="display:flex" aria-labelledby="h-ni"><h2 id="h-ni">Новый стажёр</h2>'+
    '<label class="field">ФИО<input id="ni-name" data-keep data-live="ni" placeholder="Фамилия Имя" value="'+esc(nameV)+'" autocomplete="off"></label>'+
    '<label class="field">Логин<input id="ni-login" data-keep placeholder="создастся из ФИО" value="'+esc(loginV)+'" autocomplete="off"></label>'+
    '<label class="field">Пароль<span class="row" style="flex-wrap:nowrap"><input id="ni-pw" data-keep value="'+esc(f('ni-pw', S.ui.genPw || (S.ui.genPw = genPw())))+'" autocomplete="off" style="flex:1;min-width:0"><button class="btn" type="button" data-act="ni-gen">Новый</button></span></label>'+
    (S.ui.niErr?'<p class="err" style="margin:0">'+esc(S.ui.niErr)+'</p>':'')+
    '<button class="btn primary" type="submit">Создать доступ</button><span class="small muted">Стажёр получит доступы группы «'+esc(g.name)+'».</span></form>';

  var scope = S.ui.scope && S.interns[S.ui.scope] && S.interns[S.ui.scope].groupId===gid ? S.ui.scope : 'group';
  var openCount=0, total=0;

  }).join('');
  var scopeSel = '<div class="row"><div class="seg" role="group" aria-label="Кому открывать"><button type="button" class="'+(scope==='group'?'on':'')+'" data-act="scope" data-s="group" aria-pressed="'+(scope==='group')+'">Всей группе</button><button type="button" class="'+(scope!=='group'?'on':'')+'" data-act="scope" data-s="'+(list[0]?list[0].id:'group')+'" aria-pressed="'+(scope!=='group')+'"'+(list.length?'':' disabled')+'>Одному стажёру</button></div>'+

  var trCard = '<section class="card" style="padding-block:14px"><div class="row" style="align-items:flex-end"><label class="field" style="min-width:240px">Тренер группы «'+esc(g.name)+'»<select id="g-trainer" data-act-change="g-trainer"><option value="">— не выбран —</option>'+trainersList().concat(g.trainer && trainersList().indexOf(g.trainer)<0 ? [g.trainer] : []).map(function(t){ return '<option'+(g.trainer===t?' selected':'')+'>'+esc(t)+'</option>'; }).join('')+'</select></label>'+(trainersList().length?'':'<span class="small muted">Список тренеров заполняется в «Настройка → Тренеры и итоги».</span>')+'</div></section>';

    '<div class="cols"><section class="card wide" aria-labelledby="h-il"><h2 id="h-il">Стажёры группы «'+esc(g.name)+'»</h2>'+table+'</section>'+form+'</div>'+
    '<section class="card" aria-labelledby="h-acc"><div class="row between"><div class="stack" style="gap:4px"><h2 id="h-acc">Доступ к материалам</h2><span class="small muted num">'+(scope==='group'?'Группа':esc(S.interns[scope].name))+': открыто '+openCount+' из '+total+'. Открытая тема сразу появляется у стажёров.</span></div>'+scopeSel+'</div>'+
    toneLegend(allItems())+'<div class="grid" style="--min:230px;gap:14px">'+grid+'</div></section>';

/* ---------- trainer: roll call ---------- */
function rollsOf(gid){ return Object.keys(S.rolls||{}).map(function(k){ return Object.assign({id:k}, S.rolls[k]); }).filter(function(r){ return r.groupId===gid; }).sort(function(a,b){ return (b.startedAt||0)-(a.startedAt||0); }); }
function rollMarkAt(iid, rid){ var r = P(iid).roll; return r && r.id===rid ? r.at : null; }
function hhmm(t){ return t ? new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : ''; }
function tRoll(){
  var gid = curGid(); var g = gid ? S.groups[gid] : null;
  if(!g) return head('Перекличка','')+'<div class="empty"><b>Сначала создайте группу</b><button class="btn primary" data-act="nav" data-v="t-access">Перейти к группам</button></div>';
  var rl = liveOf(gid).roll; var active = !!(rl && rl.active);
  var list = internsOf(gid).filter(function(i){ return !i.suspended; });
  var hist = rollsOf(gid);
  var top;
  if(active){
    var here = list.filter(function(i){ return rollMarkAt(i.id, rl.id); }).length;
    var mins = Math.max(0, Math.round((Date.now()-(rl.startedAt||Date.now()))/60000));
    top = '<section class="card" aria-labelledby="h-rl"><div class="row between"><div class="stack" style="gap:4px"><h2 id="h-rl"><span class="pulse" aria-hidden="true"></span>Перекличка идёт</h2><span class="small muted">Началась в '+hhmm(rl.startedAt)+(mins?' · '+mins+' мин назад':'')+'. У стажёров на экране только кнопка «Я на месте».</span></div>'+
      '<div class="row" style="align-items:center"><span class="num" style="font-family:var(--f-display);font-size:28px">'+here+' / '+list.length+'</span><button class="btn sm" type="button" data-act="roll-view" data-id="live" title="Кто отметился" aria-label="Кто отметился">👁</button><button class="btn danger" type="button" data-act="roll-stop">Завершить перекличку</button></div></div>'+
      '<div class="meter"><i style="width:'+(list.length?Math.round(here/list.length*100):0)+'%"></i></div>'+
      (list.length ? '<div>'+list.map(function(i){ var at = rollMarkAt(i.id, rl.id);
        return '<div class="rollrow"><span class="row" style="gap:12px;flex-wrap:nowrap"><span class="rmark '+(at?'yes':'no')+'" aria-hidden="true">'+(at?'✓':'✕')+'</span><b>'+esc(i.name)+'</b></span><span class="small '+(at?'':'muted')+'">'+(at?'на месте · '+hhmm(at):'не отметился')+'</span></div>'; }).join('')+'</div>' : '<p class="muted" style="margin:0">В группе нет активных стажёров.</p>')+
      '</section>';
  } else {
    top = '<section class="card" aria-labelledby="h-rl"><h2 id="h-rl">Начать перекличку</h2><p style="margin:0;line-height:1.55">У всех стажёров группы «'+esc(g.name)+'» кабинет закроется экраном переклички с кнопкой «Я на месте». Вы видите, кто отметился, и завершаете перекличку — после этого стажёры снова пользуются кабинетом как обычно.</p>'+
      '<div class="row"><button class="btn primary" type="button" data-act="roll-start"'+(list.length?'':' disabled')+'>Начать перекличку · '+list.length+' стаж.</button></div></section>';
  }
  var histBox = '<section class="card" aria-labelledby="h-rh"><div class="row between"><h2 id="h-rh">Журнал перекличек</h2>'+(hist.length?'<button class="btn sm" type="button" data-act="xl-rolls">Выгрузить в Excel</button>':'')+'</div>'+
    (hist.length ? '<div class="table-wrap"><table><thead><tr><th>Дата</th><th>Время</th><th>На месте</th><th>Не отметились</th><th></th></tr></thead><tbody>'+hist.map(function(r){ var ls = r.list||[]; var yes = ls.filter(function(x){ return x.at; }); var no = ls.filter(function(x){ return !x.at; });
        return '<tr><td>'+esc(fmtDay(r.startedAt))+'</td><td class="num">'+hhmm(r.startedAt)+'–'+hhmm(r.endedAt)+'</td><td class="num"><b>'+yes.length+' / '+ls.length+'</b></td><td class="small">'+(no.length?no.map(function(x){ return esc(x.name); }).join(', '):'<span class="muted">все на месте</span>')+'</td><td><button class="btn sm" type="button" data-act="roll-view" data-id="'+esc(r.id)+'" title="Кто отметился" aria-label="Кто отметился">👁</button></td></tr>'; }).join('')+'</tbody></table></div>' : '<p class="muted" style="margin:0">Перекличек в этой группе ещё не было.</p>')+'</section>';
  return head('Перекличка', esc(g.name), groupPicker(false))+top+histBox;
}
function xlRolls(gid){
  var g = S.groups[gid]; var rows = [['Дата','Начало','Конец','ФИО','Отметился','Время отметки']];
  rollsOf(gid).slice().reverse().forEach(function(r){ (r.list||[]).forEach(function(x){ rows.push([fmtDT(r.startedAt).slice(0,10), hhmm(r.startedAt), hhmm(r.endedAt), x.name, x.at?'да':'нет', hhmm(x.at)]); }); });
  var names = {}; rollsOf(gid).forEach(function(r){ (r.list||[]).forEach(function(x){ var n = names[x.iid] = names[x.iid] || {name:x.name, y:0, t:0}; n.t++; if(x.at) n.y++; }); });
  var sum = [['ФИО','Перекличек','На месте','Пропущено','Посещаемость, %']].concat(Object.keys(names).map(function(k){ var n = names[k]; return [n.name, n.t, n.y, n.t-n.y, n.t?Math.round(n.y/n.t*100):'']; }).sort(function(a,b){ return String(a[0]).localeCompare(String(b[0]),'ru'); }));
  return xlSave('Перекличка — '+(g?g.name:''), [{name:'Посещаемость', rows:sum, filter:1}, {name:'Журнал', rows:rows, filter:1}]);
}

/* ---------- trainer: presentation ---------- */
function tPres(){
  var gid = curGid(); var g = gid ? S.groups[gid] : null;
  if(!g) return head('Ведение презентации','')+'<div class="empty"><b>Сначала создайте группу</b><button class="btn primary" data-act="nav" data-v="t-access">Перейти к группам</button></div>';
  var lv = liveOf(gid);
  var ids = Object.keys(decksMap());
  if(!ids.length) return head('Ведение презентации','')+'<div class="empty"><b>Презентаций пока нет</b><button class="btn primary" data-act="st-go" data-s="decks">Создать в настройке</button></div>';
  var deckId = lv.active && deck(lv.deck) ? lv.deck : (S.ui.tdeck && deck(S.ui.tdeck) ? S.ui.tdeck : ids[0]);
  var dk = deck(deckId); var total = dk.slides.length;
  var opened = openedSlides(deckId, gid);
  var cur = lv.active ? (lv.slide||1) : (S.ui.tslide || 1);
  cur = Math.max(1, Math.min(cur, total));
  var s = dk.slides[cur-1];
  var pick = '<label class="field" style="min-width:240px">Презентация<select id="tdeck" data-act-change="tdeck"'+(lv.active?' disabled':'')+'>'+ids.map(function(id){ return '<option value="'+esc(id)+'"'+(id===deckId?' selected':'')+'>'+esc(deck(id).title)+'</option>'; }).join('')+'</select></label>';
  var list = internsOf(gid);
  var online = list.map(function(i){ var pr = P(i.id).pres; var on = pr && pr.deck===deckId && Date.now()-pr.at < 180000; return {name:i.name, on:on, slide: on?pr.slide:null}; });
  var onCount = online.filter(function(o){ return o.on; }).length;
  var controls = lv.active ?
    '<div class="row"><button class="btn" type="button" data-act="tp-prev"'+(cur<=1?' disabled':'')+'>Назад</button><button class="btn amber" style="flex:1 1 260px" type="button" data-act="tp-next"'+(cur>=total?' disabled':'')+'>'+(cur<opened?'Следующий слайд':'Открыть следующий слайд группе')+'</button><span class="small muted num">Открыто '+opened+' из '+total+'</span></div>'+
    '<div class="card tight" style="flex-direction:row;align-items:center;justify-content:space-between"><div class="stack" style="gap:2px"><b>Стажёры следуют за мной</b><span class="small muted">'+(lv.sync?'У стажёров на экране тот же слайд':'Стажёры листают открытые слайды сами')+'</span></div><button type="button" class="toggle'+(lv.sync?' on':'')+'" data-act="tp-sync" aria-pressed="'+!!lv.sync+'" aria-label="Синхронизация слайдов"><i></i></button></div>'
    : '<div class="card tight" style="gap:12px"><b>Показ не идёт · стажёрам открыто '+opened+' из '+total+' слайдов</b><span class="small muted">При старте у стажёров откроется первый слайд, остальные вы открываете по одному. Можно открыть все слайды сразу — например, для повторения.</span><div class="row"><button class="btn amber" type="button" data-act="tp-start">Начать показ для группы</button><button class="btn" type="button" data-act="tp-openall"'+(opened>=total?' disabled':'')+'>Открыть все слайды</button><button class="btn" type="button" data-act="tp-closeall"'+(opened<1?' disabled':'')+'>Закрыть все</button></div></div>';
  return head('Ведение презентации', esc(g.name)+' · '+esc(dk.title), '<div class="row" style="align-items:flex-end">'+groupPicker(false)+pick+(lv.active?'<button class="btn danger" type="button" data-act="tp-stop">Завершить показ</button>':'')+'</div>')+
    '<div class="cols"><div class="wide stack" style="gap:14px">'+
      slideHtml(s, cur, total)+controls+
    '</div><div class="narrow">'+
      '<section class="card" style="background:var(--amber-soft);border-color:transparent" aria-labelledby="h-tn"><h2 id="h-tn" style="font-size:16px">Заметки тренера · видите только вы</h2><p style="margin:0;line-height:1.55;white-space:pre-line">'+esc(s.note||'Заметок к этому слайду нет. Добавьте их в «Настройка → Презентации».')+'</p></section>'+
      (function(){ var tp = allItems().filter(function(i){ return i.deck===deckId && i.slide; }); if(!tp.length) return '';
        return '<section class="card" aria-labelledby="h-tp"><div class="row between"><h2 id="h-tp" style="font-size:16px">Темы плана</h2><span class="small muted num">'+tp.length+'</span></div><div class="topics">'+tp.map(function(i){ var on = cur>=i.slide && cur<=Math.max(i.slide, i.slideTo||i.slide);
          return '<button type="button" class="topic tone-'+toneOf(i)+(on?' on':'')+'" data-act="tp-go" data-n="'+i.slide+'"'+(on?' aria-current="true"':'')+'><span>'+esc(i.title)+'</span><span class="n num">'+esc(slideRef(i).replace('Слайд ','сл. '))+'</span></button>'; }).join('')+'</div><span class="small muted">'+(lv.active?'Нажмите тему — группа перейдёт на её слайд.':'Нажмите тему, чтобы открыть её слайд.')+'</span></section>'; })()+
      '<section class="card" aria-labelledby="h-on"><div class="row between"><h2 id="h-on" style="font-size:16px">В презентации</h2><span class="small muted num">'+onCount+' из '+list.length+' онлайн</span></div>'+(list.length? online.map(function(o){ return '<div class="row between" style="min-height:34px;flex-wrap:nowrap"><span class="row" style="gap:10px;flex-wrap:nowrap"><span aria-hidden="true" style="width:8px;height:8px;border-radius:50%;background:'+(o.on?'var(--accent)':'var(--line)')+'"></span>'+esc(o.name)+'</span><span class="small num" style="color:'+(o.on&&o.slide!==cur?'var(--amber-ink)':'var(--muted)')+'">'+(o.on?'слайд '+o.slide:'не в сети')+'</span></div>'; }).join('') : '<p class="muted" style="margin:0">В группе нет стажёров.</p>')+'</section>'+
    '</div></div>'+
    '<section aria-labelledby="h-all" class="stack"><h2 id="h-all">Все слайды'+(lv.active?' · нажмите, чтобы перейти и открыть группе':' · нажмите, чтобы посмотреть')+'</h2><div class="thumbs">'+dk.slides.map(function(sl,i){ var n=i+1; var o=n<=opened;
      return '<button type="button" class="thumb'+(n===cur?' live':'')+(o?'':' locked')+'" style="cursor:pointer" data-act="tp-go" data-n="'+n+'">'+thumbImg(sl)+'<small style="color:'+(n===cur?'var(--amber-ink)':(o?'var(--accent-ink)':'var(--faint)'))+'">'+n+' · '+(n===cur?(lv.active?'на экране':'просмотр'):(o?'открыт':'закрыт'))+'</small>'+(sl.title?'<span>'+esc(sl.title)+'</span>':'')+'</button>'; }).join('')+'</div></section>';
}

/* trainer-only intern data: profiles/<iid> (interns cannot read this collection) */
function prof(iid){ return (S.profiles && S.profiles[iid]) || {}; }
function attOf(iid, dayId){ var a = prof(iid).att; var v = a && a[dayId]; return v==='yes'||v==='no' ? v : ''; }
function attCount(iid){ var y=0, n=0; days().forEach(function(d){ var v = attOf(iid, d.id); if(v==='yes') y++; else if(v==='no') n++; }); return {y:y, n:n}; }
function saveProfile(iid, patch){ return upsert('profiles/'+iid, S.profiles[iid], patch).catch(writeErr); }
function attBtn(iid, d, di, big){ var v = attOf(iid, d.id); var lbl = v==='yes'?'✓':(v==='no'?'✕':'—');
  return '<button type="button" class="att '+v+'" data-act="att-cycle" data-i="'+esc(iid)+'" data-d="'+esc(d.id)+'" title="'+esc('День '+(di+1)+': '+(v==='yes'?'присутствовал':(v==='no'?'отсутствовал':'не отмечено'))+' — нажмите, чтобы изменить')+'" aria-label="'+esc('День '+(di+1)+': '+(v==='yes'?'присутствовал':(v==='no'?'отсутствовал':'не отмечено')))+'">'+(big?'<small>День '+(di+1)+'</small>':'')+lbl+'</button>'; }
function attText(v){ return v==='yes'?'присутствовал':(v==='no'?'отсутствовал':''); }
function fmtDT(t){ if(!t) return ''; var d = new Date(t); function z(n){ return (n<10?'0':'')+n; } return z(d.getDate())+'.'+z(d.getMonth()+1)+'.'+d.getFullYear()+' '+z(d.getHours())+':'+z(d.getMinutes()); }
function testRec(iid, tid){ return P(iid).tests && P(iid).tests[tid]; }
function internStatus(iid){
  var ti = testItems(); var rs = ti.map(function(i){ return testRec(iid, i.test); });
  var passed = rs.filter(function(r){ return r && r.passed; }).length; var started = rs.filter(Boolean).length;
  if(!ti.length) return {key:'none', label:'Тестов нет'};
  if(passed===ti.length) return {key:'ok', label:'Все тесты сданы'};
  var failed = rs.filter(function(r, k){ return r && !r.passed && (r.attempts||0) >= ((test(ti[k].test)||{}).attempts||3); }).length;
  if(failed) return {key:'bad', label:'Не сдан тест'};
  if(!started) return {key:'', label:'Тесты не начаты'};
  return {key:'warn', label:'Сдано '+passed+' из '+ti.length};
}
function statusChipR(st){ return '<span class="chip '+(st.key||'')+'">'+esc(st.label)+'</span>'; }
function pctCell(r, tt){ if(!r) return '<td class="num muted">—</td>'; return '<td class="num '+(r.passed?'pct-ok':'pct-bad')+'">'+r.best+'%<span class="small muted" style="font-weight:400"> ×'+(r.attempts||0)+'</span></td>'; }
function groupStats(gid){
  var list = internsOf(gid); var ti = testItems();
  var st = list.map(function(i){ return internStats(i.id); });
  var avgP = list.length ? Math.round(st.reduce(function(a,x){ return a+x.pct; },0)/list.length) : null;
  var avs = st.filter(function(x){ return x.avg!=null; }); var avgT = avs.length ? Math.round(avs.reduce(function(a,x){ return a+x.avg; },0)/avs.length) : null;
  var allOk = list.filter(function(i){ return ti.length && internStatus(i.id).key==='ok'; }).length;
  var resp = S.surveys.filter(function(x){ return x.groupId===gid; }).length;
  var active = list.filter(function(i){ var s2 = P(i.id).seen; return s2 && Date.now()-s2 < 86400000; }).length;
  return {n:list.length, avgP:avgP, avgT:avgT, allOk:allOk, resp:resp, active:active};
}
function questionStats(tid, iids){
  var tt = test(tid); if(!tt) return [];
  return tt.questions.map(function(q, qi){ var n=0, ok=0; iids.forEach(function(id){ var r = testRec(id, tid); if(r && r.ans && r.ans[qi]!=null){ n++; if(r.ans[qi]===q.correct) ok++; } }); return {qi:qi, q:q, n:n, ok:ok, err: n ? Math.round((n-ok)/n*100) : null}; });
}
function tResults(){
  var mode = S.ui.rmode || 'group';
  var segs = [['all','Все группы'],['group','Группа'],['att','Присутствие'],['intern','Стажёр'],['surveys','Опросы']];
  var seg = '<div class="seg" role="group" aria-label="Режим">'+segs.map(function(x){ return '<button type="button" class="'+(mode===x[0]?'on':'')+'" data-act="rmode" data-m="'+x[0]+'" aria-pressed="'+(mode===x[0])+'">'+x[1]+'</button>'; }).join('')+'</div>';
  if(mode==='all') return head('Результаты','Сравнение групп', '<div class="row" style="align-items:flex-end">'+seg+'<button class="btn primary" type="button" data-act="xl-track-all">Выгрузить стажировки</button><button class="btn" type="button" data-act="xl-all">Сравнение в Excel</button></div>')+rAll();
  var gid = curGid(); var g = gid ? S.groups[gid] : null;
  if(!g) return head('Результаты','', seg)+'<div class="empty"><b>Сначала создайте группу</b></div>';
  var right = '<div class="row" style="align-items:flex-end">'+seg+groupPicker(false);
  if(mode==='intern') return head('Результаты', esc(g.name)+' · карта стажёра', right+'</div>')+rIntern(gid);
  if(mode==='att') return head('Результаты', esc(g.name)+' · присутствие на стажировке', right+'<button class="btn primary" type="button" data-act="xl-track">Выгрузить стажировку</button><button class="btn" type="button" data-act="xl-track-all">Все группы направления</button></div>')+rAtt(gid);
  if(mode==='surveys') return head('Результаты', esc(g.name)+' · опросы', right+'<button class="btn" type="button" data-act="xl-surveys">Выгрузить в Excel</button></div>')+rSurveys(gid);
  return head('Результаты', esc(g.name)+(g.trainer?' · тренер '+esc(g.trainer):''), right+'<button class="btn primary" type="button" data-act="xl-track">Выгрузить стажировку</button><button class="btn" type="button" data-act="xl-group">Подробный Excel</button></div>')+rGroup(gid);
}

  var ti = testItems();
  var rows = gl.map(function(g){ var st = groupStats(g.id); var list = internsOf(g.id);
    return '<tr><td><b>'+esc(g.name)+'</b><br><span class="small muted">старт '+esc(g.start||'—')+'</span></td><td class="num">'+st.n+'</td><td class="num">'+(st.avgP==null?'—':st.avgP+'%')+'</td><td class="num">'+(st.avgT==null?'—':st.avgT+'%')+'</td>'+
      ti.map(function(i){ var rs = list.map(function(x){ return testRec(x.id, i.test); }).filter(Boolean); var pass = rs.filter(function(r){ return r.passed; }).length; return '<td class="num">'+(rs.length? pass+' / '+list.length : '<span class="muted">—</span>')+'</td>'; }).join('')+
      '<td class="num">'+(ti.length? st.allOk+' / '+st.n : '—')+'</td><td class="num">'+st.resp+'</td><td style="text-align:right"><button class="btn sm" type="button" data-act="rgo" data-g="'+esc(g.id)+'">Открыть</button></td></tr>'; }).join('');
  return '<section class="card" aria-label="Группы"><div class="table-wrap"><table><thead><tr><th>Группа</th><th>Стажёров</th><th>Прогресс</th><th>Ср. балл</th>'+ti.map(function(i){ return '<th title="'+esc(i.title)+'">Д'+(i.dayIdx+1)+' сдали</th>'; }).join('')+'<th>Сдали все</th><th>Ответов в опросах</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="hint">«Д2 сдали» — сколько стажёров группы сдали тест, стоящий в плане в день 2.</p></section>';

  var table = list.length ? '<div class="table-wrap"><table><thead><tr><th>Стажёр</th><th>Прогресс</th>'+ti.map(function(i){ return '<th title="'+esc(i.title)+'">Д'+(i.dayIdx+1)+'</th>'; }).join('')+'<th>Ср. балл</th><th>Присутствие</th><th>Статус</th><th>Был в ЛК</th><th></th></tr></thead><tbody>'+list.map(function(i){

  }).join('')+'</tbody></table></div>' : '<p class="muted" style="margin:0">В группе нет стажёров.</p>';

function loadJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise(function(res, rej){ var sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload = function(){ window.JSZip ? res(window.JSZip) : rej(); }; sc.onerror = function(){ rej(); }; document.head.appendChild(sc); });
}
function readImportFiles(files){
  files = Array.prototype.slice.call(files||[]);
  var zipF = files.filter(function(x){ return /\.zip$/i.test(x.name) || x.type==='application/zip' || x.type==='application/x-zip-compressed'; })[0];
  if(zipF){
    return loadJSZip().catch(function(){ throw {message:'Не удалось загрузить модуль для чтения архива. Распакуйте архив и выберите manifest.json вместе со всеми картинками.'}; })
      .then(function(JSZip){ return JSZip.loadAsync(zipF); })
      .then(function(z){
        var mf = z.file('manifest.json') || z.file(/(^|\/)manifest\.json$/)[0];
        if(!mf) throw {message:'В архиве нет manifest.json — это не пакет импорта.'};
        var prefix = mf.name.replace(/manifest\.json$/, '');
        return mf.async('string').then(function(txt){ return {name:zipF.name, text:txt, get:function(n){ var e = z.file(prefix+n); return e ? e.async('blob') : Promise.reject({message:'нет файла '+n}); }, has:function(n){ return !!z.file(prefix+n); }}; });
      });
  }
  var byName = {}; files.forEach(function(x){ byName[x.name] = x; });
  var mf = byName['manifest.json'];
  if(!mf) return Promise.reject({message:'Выберите архив .zip или файл manifest.json вместе с картинками слайдов.'});
  return mf.text().then(function(txt){ return {name:'manifest.json + '+(files.length-1)+' файлов', text:txt, get:function(n){ return byName[n] ? Promise.resolve(byName[n]) : Promise.reject({message:'нет файла '+n}); }, has:function(n){ return !!byName[n]; }}; });
}
function importParse(files){
  S.ui.imp = {status:'reading'}; render();
  readImportFiles(files).then(function(r){
    var man; try{ man = JSON.parse(r.text); }catch(e){ throw {message:'manifest.json повреждён.'}; }
    if(!man || man.format!=='start-import') throw {message:'Это не пакет импорта кабинета «Старт».'};
    var missing = []; Object.keys(man.decks||{}).forEach(function(k){ (man.decks[k].slides||[]).forEach(function(sl){ if(sl.file && !r.has(sl.file)) missing.push(sl.file); }); });

function safeName(s){ return String(s).toLowerCase().replace(/[^a-z0-9._-]+/g, '-').replace(/-+/g,'-'); }
function importRun(){
  var im = S.ui.imp; if(!im || !im.man || im.status==='running') return;
  if(!S.db || !sb){ toast('Нет подключения к базе.'); return; }
  var m = im.man; var o = im.opts; var ver = safeName(m.version || ('p'+Date.now()));
  var jobs = []; if(o.decks) Object.keys(m.decks||{}).forEach(function(k){ (m.decks[k].slides||[]).forEach(function(sl){ if(sl.file) jobs.push({deck:k, sl:sl, name:'imp-'+ver+'-'+safeName(sl.file)}); }); });
  im.status = 'running'; im.done = 0; im.total = jobs.length + (o.decks?1:0) + (o.tests?1:0) + (o.program?1:0); im.step = jobs.length ? 'Загружаю слайды в хранилище…' : 'Сохраняю…'; render();
  var failed = []; var idx = 0;
  function worker(){
    if(idx >= jobs.length) return Promise.resolve();
    var j = jobs[idx++];
    return im.get(j.sl.file).then(function(blob){
      var type = /\.png$/i.test(j.sl.file) ? 'image/png' : (/\.webp$/i.test(j.sl.file) ? 'image/webp' : 'image/jpeg');
      return sb.storage.from('slides').upload(j.name, blob, {contentType:type, upsert:true, cacheControl:'3600'});
    }).then(function(r){ if(r && r.error) failed.push(j.sl.file+': '+r.error.message); }, function(e){ failed.push(j.sl.file+': '+((e&&e.message)||'ошибка')); })
      .then(function(){ im.done++; schedule(); return worker(); });
  }
  Promise.all([worker(), worker(), worker(), worker()]).then(function(){
    if(failed.length) throw {message:'Не загрузилось слайдов: '+failed.length+'. Первая ошибка — '+failed[0]+'. Проверьте, что в Supabase выполнен schema.sql (хранилище «slides»), и запустите импорт ещё раз — уже загруженные слайды просто перезапишутся.'};
    var chain = Promise.resolve(); var oldImgs = []; var newImgs = {};
    if(o.decks) chain = chain.then(function(){
      im.step = 'Сохраняю презентации…'; schedule();
      var doc = clone(S.content.slides || {decks:{}}); doc.decks = doc.decks || {};
      Object.keys(m.decks).forEach(function(k){
        var prev = doc.decks[k]; var prevNotes = {};
        if(prev) (prev.slides||[]).forEach(function(sl){ if(sl.image){ oldImgs.push(sl.image); if(sl.note) prevNotes[sl.image] = sl.note; } });
        doc.decks[k] = {title:m.decks[k].title, slides:(m.decks[k].slides||[]).map(function(sl){ var name = 'imp-'+ver+'-'+safeName(sl.file); newImgs[name]=1; return {image:name, title:sl.title||'', note:prevNotes[name] || sl.note || ''}; })};
      });
      return S.db.doc(dirPath('slides', activeDir())).set(doc).then(function(){ setContent('slides', clone(doc)); im.done++; });
    });
    if(o.tests) chain = chain.then(function(){
      im.step = 'Сохраняю опросники…'; schedule();
      var doc = clone(S.content.tests || {tests:{}}); doc.tests = doc.tests || {};
      Object.keys(m.tests).forEach(function(k){ doc.tests[k] = clone(m.tests[k]); });
      return S.db.doc(dirPath('tests', activeDir())).set(doc).then(function(){ setContent('tests', clone(doc)); im.done++; });
    });
    if(o.program) chain = chain.then(function(){
      im.step = 'Сохраняю план стажировки…'; schedule();
      var doc = clone(m.program);
      return S.db.doc(dirPath('program', activeDir())).set(doc).then(function(){ setContent('program', clone(doc)); im.done++; });
    });
    return chain.then(function(){
      ['program','decks','tests'].forEach(function(k){ S.draft[k] = null; S.dirty[k] = false; });
      var del = oldImgs.filter(function(a){ return !newImgs[a]; });
      if(S.assets) del.forEach(function(a){ S.assets.delete(a).catch(function(){}); });
      var pd = (m.program && m.program.days) || [];
      im.status = 'done';
      im.result = [o.program ? 'План: '+pd.length+' дн., '+pd.reduce(function(a,d){ return a+(d.items||[]).length; },0)+' тем' : '', o.decks ? 'презентаций: '+Object.keys(m.decks).length+' ('+jobs.length+' слайдов)' : '', o.tests ? 'опросников: '+Object.keys(m.tests).length : ''].filter(Boolean).join(' · ')+'.';
      render(); toast('Программа загружена на сайт');
    });
  }).catch(function(e){ im.status = 'ready'; im.err = (e && e.message) || 'Не удалось загрузить. Попробуйте ещё раз.'; render(); });
}

function cleanDraft(k, d){
  if(k==='program'){ d.days.forEach(function(day){ (day.items||[]).forEach(function(it){ ['deck','test','sim','article','desc','survey'].forEach(function(x){ if(it[x]==='' ) delete it[x]; }); if(!it.slide) delete it.slide; if(!it.slideTo || !it.slide || it.slideTo<=it.slide) delete it.slideTo; if(!it.tone) delete it.tone; if(it.url==='' && !it.material) delete it.url; }); }); }

  if(k==='tests'){ Object.keys(d.tests).forEach(function(id){ var t = d.tests[id]; t.pass = Number(t.pass==null||t.pass===''?80:t.pass); t.attempts = Math.max(1, Number(t.attempts==null||t.attempts===''?3:t.attempts)); t.questions = (t.questions||[]).map(function(q){ var opts = (q.options||[]).map(function(x){ return String(x).trim(); }).filter(Boolean); var o = {q:String(q.q||'').trim(), options:opts, correct:Math.min(Math.max(0, Number(q.correct)||0), Math.max(0, opts.length-1))}; if(q.src && String(q.src).trim()) o.src = String(q.src).trim(); return o; }).filter(function(q){ return q.q && q.options.length >= 2; }); }); }
  if(k==='surveys'){ Object.keys(d.surveys).forEach(function(id){ var v = d.surveys[id]; v.title = String(v.title||'').trim() || 'Опрос'; v.desc = String(v.desc||'').trim(); v.anonymous = v.anonymous !== false; v.always = !!v.always;

      .filter(function(q){ return q.q && ((q.type!=='choice' && q.type!=='multi') || q.options.length>=2); }); }); }

  return d;

function parseVal(el){
  var fmt = el.dataset.fmt; var v = el.value;
  if(fmt==='lines') return v.split('\n');
  if(fmt==='paras') return v.split(/\n\s*\n/);
  if(fmt==='cells') return v.split('\n').map(function(l){ var ix = l.indexOf('|'); return ix<0 ? [l.trim(), ''] : [l.slice(0,ix).trim(), l.slice(ix+1).trim()]; });
  if(fmt==='num') return v ? Number(v) : '';
  if(fmt==='hide') return !el.checked;
  if(fmt==='bool') return el.checked;
  return v;
}

/* fullscreen presentation (kept outside #app so live updates don't exit fullscreen) */
function fsUpdate(){ var el = document.getElementById('fsx'); if(!el || !S.fs) return; var m = me(); var deckId = presDeckId(); var dk = deck(deckId); if(!m || !dk){ fsClose(); return; }
  var total = dk.slides.length, limit = slideLimit(deckId); var view = Math.max(1, Math.min(curSlide(), Math.max(1, limit))); var locked = presLocked();
  el.innerHTML = '<div class="fsx-in">'+slideHtml(dk.slides[view-1], view, total)+'</div><div class="fsx-bar">'+(locked?'<span class="small">Слайды переключает тренер</span>':'<button class="btn" type="button" data-act="slide-prev"'+(view<=1?' disabled':'')+'>‹ Назад</button><span class="num">'+view+' / '+limit+'</span><button class="btn primary" type="button" data-act="slide-next"'+(view>=limit?' disabled':'')+'>Вперёд ›</button>')+'<button class="btn" type="button" data-act="pres-fs-exit">Выйти из полноэкранного режима</button></div>'; }
function fsClose(){ S.fs = false; var el = document.getElementById('fsx'); if(el){ el.hidden = true; el.innerHTML = ''; } if(document.fullscreenElement && document.exitFullscreen){ try{ document.exitFullscreen(); }catch(e){} } }

document.addEventListener('keydown', function(e){ if(!S.fs) return; if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); if(!presLocked()) A['slide-next'](); } else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); if(!presLocked()) A['slide-prev'](); } else if(e.key==='Escape'){ fsClose(); } });

function openItem(id){
  var it = itemById(id); if(!it || (S.role==='intern' && !isOpen(it))) return;

  else if(it.type==='survey'){ openSurvey({itemId:it.id, sid: it.survey && svDef(it.survey) ? it.survey : ''}); return; }
  else if(it.sim){ openPlayer(it.sim, it.id); return; }
  else if(it.deck && deck(it.deck) && !tabHidden('pres')){ S.view='pres'; S.ui.freeDeck = it.deck; S.ui.slide = it.slide||1; S.ui.unsynced = true; if(S.role==='intern' && !isDone(it) && slideLimit(it.deck) >= (it.slide||1)){ var p={items:{}}; p.items[it.id]={status:'done', at:Date.now()}; saveProgress(p); } presencePing(); }

  render(); window.scrollTo(0,0);
}

function saveDraft(k, msg){
  var data = cleanDraft(k, clone(draft(k)));
  var size = JSON.stringify(data).length; if(size > 250000){ toast('Слишком много текста для одного раздела ('+kb(size)+'). Сократите содержимое.'); return Promise.resolve(false); }
  return S.db.doc(srcPath(k)).set(data).then(function(){
    setContent(DRAFT_SRC[k], clone(data)); S.dirty[k]=false; S.draft[k]=null;
    if(k==='decks' && S.pendingDel.length && S.assets){
      var still = {}; Object.keys(data.decks||{}).forEach(function(id){ (data.decks[id].slides||[]).forEach(function(s){ if(s.image) still[s.image]=1; }); });
      var del = S.pendingDel.filter(function(a){ return !still[a]; }); S.pendingDel = [];
      del.forEach(function(a){ S.assets.delete(a).catch(function(){}); });
    }
    if(msg) toast(msg); else render();
    return true;
  }, function(e){ writeErr(e); return false; });
}
function imgFiles(list){ return Array.prototype.filter.call(list||[], function(f){ return /^image\/(png|jpeg|webp|gif)$/.test(f.type); }); }
function addSlideImages(files){
  if(S.role!=='trainer') return;
  files = imgFiles(files);
  if(!files.length){ toast('Нужны картинки PNG, JPG, WEBP или GIF.'); return; }
  if(!S.assets){ toast('Загрузка картинок недоступна: кабинет не подключён к хранилищу.'); return; }
  if(S.ui.uploading){ toast('Дождитесь окончания загрузки.'); return; }
  files.sort(function(a,b){ return String(a.name).localeCompare(String(b.name), 'ru', {numeric:true}); });
  var dd = draft('decks').decks; var cur = curDeckDraftId();
  if(!cur){ cur = uid('dk'); dd[cur] = {title:'Презентация 1', slides:[]}; S.ui.sdeck = cur; }
  S.ui.uploading = {done:0, total:files.length}; render();
  var failed = 0;
  var chain = Promise.resolve();
  files.forEach(function(file){
    chain = chain.then(function(){
      return S.assets.upload(file).then(function(r){
        var d = draft('decks').decks[cur]; if(!d) return;
        d.slides = d.slides || []; d.slides.push({image:r.id, title:'', note:''});
      }, function(e){ failed++; if(e && e.code==='too_large') toast('«'+file.name+'» больше 20 МБ — пропущен.'); })
      .then(function(){ S.ui.uploading.done++; render(); });
    });
  });
  chain.then(function(){
    S.ui.uploading = null; markDirty('decks');
    var ok = files.length - failed;
    saveDraft('decks', ok ? 'Добавлено слайдов: '+ok+(failed?'. Не загрузилось: '+failed:'')+'. Сохранено.' : 'Не удалось загрузить скриншоты. Попробуйте ещё раз.');
  });
}
function replaceSlideImage(i, file){
  if(!S.assets || !file) return;
  if(!imgFiles([file]).length){ toast('Нужна картинка PNG, JPG, WEBP или GIF.'); return; }
  var cur = curDeckDraftId(); S.ui.uploading = {done:0, total:1}; render();
  S.assets.upload(file).then(function(r){
    var s = draft('decks').decks[cur].slides[i]; if(s.image) S.pendingDel.push(s.image); s.image = r.id; delete s.points; delete s.kicker;
    S.ui.uploading = null; markDirty('decks'); saveDraft('decks', 'Скриншот заменён и сохранён.');
  }, function(){ S.ui.uploading = null; toast('Не удалось загрузить картинку.'); });
}

document.addEventListener('paste', function(e){
  if(!onDecksScreen() || !e.clipboardData) return;
  var fs = imgFiles(e.clipboardData.files);
  if(!fs.length){ var items = e.clipboardData.items||[]; for(var i=0;i<items.length;i++){ if(items[i].kind==='file'){ var fl = items[i].getAsFile(); if(fl) fs.push(fl); } } fs = imgFiles(fs); }
  if(!fs.length) return;
  e.preventDefault(); addSlideImages(fs.map(function(f, i){ return f.name && f.name!=='image.png' ? f : new File([f], 'screenshot-'+Date.now()+'-'+i+'.'+(f.type.split('/')[1]||'png'), {type:f.type}); }));
});
document.addEventListener('dragover', function(e){ if(!onDecksScreen()) return; if(e.target.closest && e.target.closest('[data-drop]')){ e.preventDefault(); if(!S.ui.dragOver){ S.ui.dragOver = true; render(); } } });
document.addEventListener('dragleave', function(e){ if(S.ui.dragOver && e.target.closest && e.target.closest('[data-drop]') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-drop]'))){ S.ui.dragOver = false; render(); } });
document.addEventListener('drop', function(e){ if(!onDecksScreen()) return; if(e.target.closest && e.target.closest('[data-drop]')){ e.preventDefault(); S.ui.dragOver = false; addSlideImages(e.dataTransfer && e.dataTransfer.files); } });
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ if(S.ui.modal){ S.ui.modal=null; render(); } } });
window.addEventListener('beforeunload', function(e){ if(Object.keys(S.dirty).some(function(k){ return S.dirty[k]; })){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('submit', function(e){
  var form = e.target; var k = form.dataset && form.dataset.form; if(!k) return; e.preventDefault();
  if(k==='login') doLogin();
  if(k==='apply') doApply();
  if(k==='trainer'){
    var tl = String(f('tr-login')).trim().toUpperCase(); var tp = String(f('tr-pw')).trim();
    if(!tl || !tp){ S.ui.trErr = 'Введите логин и пароль тренера.'; render(); return; }
    signIn(tl, tp, 'trainer');
  }
  if(k==='newgroup'){
    var name = String(f('ng-name', ngDefName())).trim() || 'Новая группа'; var gid = uid('g');
    S.db.doc('groups/'+gid).set({name:name, start:f('ng-start', ngDefStart()), access:{}, dir:activeDir(), trainer:String(f('ng-trainer','')), createdAt:Date.now()}).then(function(){ S.ui.gid=gid; S.ui.newGroup=false; delete S.form['ng-name']; toast('Группа создана'); }, writeErr);
  }
  if(k==='newintern'){
    var nm = String(f('ni-name')).trim(); var lg = String(S.form['ni-login']!=null?S.form['ni-login']:makeLogin(nm)).trim().toLowerCase(); var pw = String(f('ni-pw', S.ui.genPw)).trim();
    S.ui.niErr = !nm ? 'Укажите ФИО стажёра.' : (!lg ? 'Укажите логин.' : (pw.length<6 ? 'Пароль — минимум 6 символов.' : (Object.keys(S.interns).some(function(id){ return String(S.interns[id].login).toLowerCase()===lg; }) ? 'Логин «'+lg+'» уже занят. Измените его.' : null)));
    if(S.ui.niErr){ render(); return; }
    if(!/^[a-z0-9._-]+$/.test(lg)){ S.ui.niErr = 'Логин — только латинские буквы, цифры, точка, дефис.'; render(); return; }
    var gid2 = curGid(); S.ui.busy = true; render();
    signUpIntern(lg, pw).then(function(iid){ return S.db.doc('interns/'+iid).set({name:nm, login:lg, groupId:gid2, overrides:{}, createdAt:Date.now()}); }).then(function(){
      S.ui.busy=false; S.ui.created = {name:nm, login:lg, pw:pw}; delete S.form['ni-name']; delete S.form['ni-login']; delete S.form['ni-pw']; S.ui.genPw = genPw(); S.ui.loginAuto=true; render();
    }, function(e){ S.ui.busy=false; S.ui.niErr = (e && e.message) || 'Не удалось создать доступ.'; render(); });
  }
  if(k==='survey'){
    var sv = S.ui.survey; var def = svDef(sv.sid); if(!def) return; var it = sv.itemId ? itemById(sv.itemId) : null;
    var ans = {}; var miss = null;
    (def.questions||[]).forEach(function(q){ var v = S.form['sv-'+q.id];
      if(q.type==='text') v = String(v||'').trim().slice(0,2000);
      var empty = v==null || v==='' || (Array.isArray(v) && !v.length);
      if(empty){ if(q.required && !miss) miss = q.q; return; }
      ans[q.id] = v; });
    if(miss){ toast('Ответьте на вопрос: «'+(miss.length>60?miss.slice(0,60)+'…':miss)+'»'); return; }
    var m = me(); var doc = {survey:sv.sid||'', itemId:sv.itemId||'', groupId:m.groupId, day:it?it.day:'', answers:ans, at:Date.now()};
    if(!sv.sid){ doc.ratings = {}; SURVEY_Q.forEach(function(q){ if(ans[q[0]]!=null) doc.ratings[q[0]] = ans[q[0]]; }); doc.comment = ans.comment || ''; }
    if(def.anonymous === false){ doc.iid = S.iid; doc.name = m.name; }
    S.db.collection('surveys').add(doc).then(function(){
      var p = {surveys:{}}; p.surveys[svKey(sv)] = Date.now(); if(sv.itemId){ p.items = {}; p.items[sv.itemId] = {status:'done', at:Date.now()}; }
      saveProgress(p); (def.questions||[]).forEach(function(q){ delete S.form['sv-'+q.id]; }); toast('Спасибо, ответы отправлены');
    }, writeErr);
  }
  if(k==='profile'){
    var pid = form.dataset.id; var pk2 = function(x){ return 'pf-'+x+'-'+pid; }; var pf0 = prof(pid);
    var tg = String(f(pk2('tg'), pf0.tg||'')).trim(); if(tg && !/^@|^https?:/i.test(tg)) tg = '@'+tg.replace(/^t\.me\//i,'');
    var ageV = String(f(pk2('age'), pf0.age||'')).trim();
    saveProfile(pid, {tg:tg.slice(0,64), geo:String(f(pk2('geo'), pf0.geo||'')).trim().slice(0,60), age: ageV ? Number(ageV) : '', note:String(f(pk2('note'), pf0.note||'')).slice(0,5000), updatedAt:Date.now()})
      .then(function(){ ['tg','geo','age','note'].forEach(function(x){ delete S.form[pk2(x)]; }); toast('Данные стажёра сохранены'); });
  }
  if(k==='feedback'){
    var txt = String(f('fb-text')).trim(); if(!txt){ toast('Напишите комментарий'); return; }
    var iid2 = S.ui.rsel; var cur = S.feedback[iid2]; var entries = ((cur&&cur.entries)||[]).concat([{at:Date.now(), text:txt.slice(0,2000)}]);
    S.db.doc('feedback/'+iid2).set({entries:entries}).then(function(){ S.form['fb-text']=''; toast('Комментарий отправлен стажёру'); }, writeErr);
  }
});

function signIn(login, pw, want){
  var errKey = want==='trainer' ? 'trErr' : 'loginErr';
  S.ui.busy = true; render();
  return sb.auth.signInWithPassword({email: emailOf(login), password: pw}).then(function(r){
    if(r.error){ S.ui.busy = false; S.ui[errKey] = authErrText(r.error); render(); return; }
    return afterAuth(r.data.user, want);
  }).catch(function(e){ S.ui.busy = false; S.ui[errKey] = authErrText(e); render(); });
}
function afterAuth(user, want){
  return sb.rpc('is_trainer').then(function(r){
    var tr = !!r.data;
    if(want==='trainer' && !tr){ S.ui.trErr = 'У этого аккаунта нет прав тренера.'; S.ui.busy=false; sb.auth.signOut(); render(); return; }
    S.uid = user.id;
    return loadAll().then(function(){
      S.ui.busy = false; S.ui.loginErr = null; S.ui.trErr = null; S.ui.trainerForm = false;
      delete S.form['f-pw']; delete S.form['tr-pw'];
      if(tr){ S.role = 'trainer'; S.view = 't-access'; }
      else if(S.interns[user.id] && S.interns[user.id].suspended){ S.ui.loginErr = 'Доступ приостановлен тренером. Обратитесь к тренеру.'; sb.auth.signOut(); }
      else if(S.interns[user.id]){ S.role = 'intern'; S.iid = user.id; S.view = 'home'; saveProgress({seen:Date.now()}); S.ui.liveKey = undefined; followLive(); }
      else if(CACHE['requests/'+user.id]){ S.role = 'applicant'; }
      else { S.ui.loginErr = 'Аккаунт не найден. Обратитесь к тренеру.'; sb.auth.signOut(); }
      render();
    });
  }).catch(function(e){ S.ui.busy = false; S.ui.loginErr = authErrText(e); render(); });
}
function doLogin(){
  var lg = String(f('f-login')).trim().toLowerCase(); var pw = String(f('f-pw'));
  if(!lg || !pw){ S.ui.loginErr = 'Введите логин и пароль.'; render(); return; }
  signIn(lg, pw, 'intern');
}
function doApply(){
  var nm = String(f('ap-name')).trim(); var lg = String(S.form['ap-login']!=null?S.form['ap-login']:makeLogin(nm)).trim().toLowerCase();
  var pw = String(f('ap-pw')); var pw2 = String(f('ap-pw2')); var contact = String(f('ap-contact')).trim(); var note = String(f('ap-note')).trim();
  S.ui.apErr = nm.split(/\s+/).length < 2 ? 'Укажите фамилию и имя.' : (!/^[a-z0-9._-]{3,}$/.test(lg) ? 'Логин — от 3 символов: латинские буквы, цифры, точка, дефис.' : (pw.length < 6 ? 'Пароль — не короче 6 символов.' : (pw !== pw2 ? 'Пароли не совпадают.' : (!contact ? 'Укажите телефон или Telegram, чтобы тренер мог связаться.' : null))));
  if(S.ui.apErr){ render(); return; }
  S.ui.busy = true; render();
  sb.auth.signUp({email: emailOf(lg), password: pw}).then(function(r){
    if(r.error){ var m = r.error.message||''; throw {message: /already registered|already exists/i.test(m) ? 'Логин «'+lg+'» уже занят. Если заявку подавали вы — войдите с ним на странице входа.' : (/signups not allowed|disabled/i.test(m) ? 'Подача заявок сейчас отключена. Обратитесь к тренеру.' : 'Не удалось отправить заявку: '+m)}; }
    var u = r.data && r.data.user;
    if(!u || (u.identities && u.identities.length===0)) throw {message:'Логин «'+lg+'» уже занят.'};
    if(!r.data.session) throw {message:'Заявку не удалось завершить: в Supabase включено подтверждение почты. Сообщите тренеру.'};
    var doc = {name:nm, login:lg, contact:contact.slice(0,100), note:note.slice(0,300), status:'pending', at:Date.now()};
    return sb.from('docs').insert({path:'requests/'+u.id, data:doc}).then(function(res){
      if(res.error){ sb.auth.signOut(); throw {message: /row-level|policy/i.test(res.error.message||'') ? 'Подача заявок сейчас отключена. Обратитесь к тренеру.' : 'Не удалось отправить заявку: '+res.error.message}; }
      S.uid = u.id; setLocal('requests/'+u.id, doc);
      S.ui.busy = false; S.ui.applyForm = false; S.role = 'applicant'; ['ap-pw','ap-pw2','ap-name','ap-login','ap-contact','ap-note'].forEach(function(k){ delete S.form[k]; }); render();
    });
  }).catch(function(e){ S.ui.busy = false; S.ui.apErr = (e && e.message) || 'Не удалось отправить заявку.'; render(); });
}
function signUpIntern(login, pw){
  var tmp = supabase.createClient(CFG.url, CFG.anonKey, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false, storageKey:'start-signup-tmp'}});
  return tmp.auth.signUp({email: emailOf(login), password: pw}).then(function(r){
    if(r.error){ if(/already registered|already exists/i.test(r.error.message||'')) throw {message:'Логин «'+login+'» уже занят. Измените его.'}; throw {message:'Не удалось создать доступ: '+r.error.message}; }
    var u = r.data && r.data.user;
    if(!u || (u.identities && u.identities.length===0)) throw {message:'Логин «'+login+'» уже занят. Измените его.'};
    if(!r.data.session) S.ui.confirmWarn = true;
    return u.id;
  });
}

/* ---------- live sync: realtime channel + polling fallback ---------- */
function startRealtime(){
  try{ if(S.rt) sb.removeChannel(S.rt); }catch(e){}
  S.rt = sb.channel('docs-live-'+Date.now()).on('postgres_changes', {event:'*', schema:'public', table:'docs'}, function(pl){
    if(pl.eventType==='DELETE'){ var p = pl.old && pl.old.path; if(p) setLocal(p, undefined); }
    else if(pl.new && pl.new.path){ setLocal(pl.new.path, pl.new.data); }
  }).subscribe();
}
function sameJson(a, b){ try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return false; } }
function pollLive(){
  if(document.hidden || !S.role || !sb) return;
  var now = Date.now();
  if(S.role==='intern' && me()){
    var path = 'live/'+me().groupId;
    if(S.view==='pres' || now-(S.ui.lastLivePoll||0) > 5000){
      S.ui.lastLivePoll = now;
      sb.from('docs').select('path,data').eq('path', path).maybeSingle().then(function(r){ if(r && r.data && !sameJson(r.data.data, CACHE[path])) setLocal(path, r.data.data); });
    }
  }
  var rollOn = S.role==='trainer' && S.view==='t-roll' && liveOf(curGid()).roll && liveOf(curGid()).roll.active;
  if(S.role==='trainer' && (S.view==='t-pres' || rollOn) && now-(S.ui.lastProgPoll||0) > (rollOn ? 2500 : 10000)){
    S.ui.lastProgPoll = now;
    sb.from('docs').select('path,data').like('path', 'progress/%').then(function(r){ ((r && r.data)||[]).forEach(function(row){ if(!sameJson(row.data, CACHE[row.path])) setLocal(row.path, row.data); }); });
  }
}
function followLive(){
  if(S.role!=='intern' || !me()) return;
  var lv = S.live[me().groupId] || {};
  var key = lv.active ? (lv.deck+':'+(lv.slide||1)) : '';
  if(key && S.ui.liveKey !== undefined && key !== S.ui.liveKey && lv.sync){ S.ui.unsynced = false; S.ui.freeDeck = null; if(S.view==='pres') setTimeout(presencePing, 0); }
  S.ui.liveKey = key;
}

/* ---------- boot ---------- */
render();
if(!window.supabase || !CFG.url || !CFG.anonKey || /ВСТАВЬТЕ|XXXX/.test(CFG.url + CFG.anonKey)){
  S.dbState = 'none'; render();
} else {
  sb = supabase.createClient(CFG.url, CFG.anonKey);
  S.db = DB; S.assets = ASSETS; S.canEdit = true; S.dbState = 'ok';
  ['org','settings'].forEach(function(k){
    S.db.doc('content/'+k).onSnapshot(function(s){ S.content[k] = s.exists ? s.data() : null; S.loaded[k]=true; if(k==='settings') subDirs(); schedule(); });
  });
  subDirs();
  [['groups','groups'],['interns','interns'],['progress','progress'],['feedback','feedback'],['live','live'],['sims','sims'],['requests','requests'],['rolls','rolls'],['profiles','profiles']].forEach(function(c){
    S.db.collection(c[0]).onSnapshot(function(snap){ var o={}; snap.docs.forEach(function(d){ o[d.id]=d.data(); }); S[c[1]]=o; S.loaded[c[0]]=true; if(c[0]==='interns'){ checkApproved(); checkSuspended(); } if(c[0]==='live') followLive(); schedule(); });
  });
  S.db.collection('surveys').onSnapshot(function(snap){ S.surveys = snap.docs.map(function(d){ return d.data(); }); schedule(); });
  startRealtime();
  sb.auth.onAuthStateChange(function(ev){ if(ev==='SIGNED_IN' || ev==='TOKEN_REFRESHED') startRealtime(); });
  setInterval(pollLive, 3000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && S.role) loadAll().catch(function(){}); });
  setInterval(function(){ if(S.role && !document.hidden) loadAll().catch(function(){}); }, 120000);
  sb.from('docs').select('path,data').eq('path','content/settings').maybeSingle().then(function(r){ if(r.data) setLocal('content/settings', r.data.data); });
  S.ui.busy = true;
  sb.auth.getSession().then(function(r){
    var s = r.data && r.data.session;
    if(s) afterAuth(s.user, null); else { S.ui.busy = false; render(); }
  });
}
})();

</script>
