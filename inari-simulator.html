<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажёр Inari</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Учебная копия интерфейса CRM Inari. Все данные вымышленные. */
:root{
  --side:#2f3646; --side-2:#262c3a; --side-ink:#9aa3b5; --side-ink-on:#ffffff;
  --bg:#f3f4f8; --surface:#ffffff; --line:#e6e8ef; --line-2:#eef0f5;
  --ink:#313a46; --muted:#7a8294; --faint:#a8aebb;
  --blue:#52a8ec; --blue-d:#3b95dc; --indigo:#6a77e8; --red:#f0646c; --green:#36c58c; --green-d:#2bb07b; --amber:#f2b33d;
  --lav:#cfd3f6; --lav-2:#dfe2fa;
  --tag-y:#e1d02c; --tag-p:#f6c6d6; --tag-c:#7fe6e6; --tag-o:#f7b267;
  --f:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:13px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue-d)}
svg.i{width:1em;height:1em;flex-shrink:0;vertical-align:-.15em}
.train-badge{position:fixed;left:50%;transform:translateX(-50%);top:0;z-index:90;background:#ffcf4a;color:#3b2f00;font-weight:800;font-size:11px;letter-spacing:.06em;padding:3px 12px;border-radius:0 0 8px 8px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}

/* login */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#f7f8fb}
.lcard{width:100%;max-width:330px;background:#fff;border-radius:6px;box-shadow:0 6px 24px rgba(40,50,80,.08);overflow:hidden}
.lhead{background:#d6dafc;padding:18px 20px 34px;position:relative;display:flex;justify-content:space-between;gap:10px}
.lhead b{display:block;color:#4b56c7;font-weight:700;font-size:13px}
.lhead span{color:#5b63b9;font-size:12px}
.llogo{position:absolute;left:18px;bottom:-24px;width:48px;height:48px;border-radius:50%;background:#eef0f8;display:flex;align-items:center;justify-content:center;border:3px solid #fff}
.lbody{padding:40px 20px 22px;display:flex;flex-direction:column;gap:14px}
.lf label{display:block;font-size:12.5px;margin-bottom:5px}
.lf label i{color:var(--red);font-style:normal}
.lf input{width:100%;height:34px;border:1px solid var(--line);border-radius:4px;padding:0 10px;background:#f7f8fb;color:var(--muted)}
.lnote{font-size:11.5px;color:var(--muted);background:#fff7dd;border:1px solid #f4e2a5;border-radius:4px;padding:8px 10px;line-height:1.45}
.lbtn{height:34px;border:0;border-radius:4px;background:#5d6ce0;color:#fff;font-weight:700}
.lbtn:hover{background:#4c5bd3}

/* shell */
.app{display:flex;min-height:100%}
.side{width:58px;background:var(--side);color:var(--side-ink);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;transition:width .15s}
.app.wide .side{width:210px}
.side .logo{height:56px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;letter-spacing:.02em;border-bottom:1px solid rgba(255,255,255,.04)}
.side nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 0}
.nitem{position:relative}
.nbtn{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--side-ink);padding:10px 19px;font-size:13px;text-align:left;white-space:nowrap}
.nbtn svg.i{font-size:18px}
.nbtn:hover,.nbtn.on{color:var(--side-ink-on)}
.nbtn .lbl,.nbtn .car{display:none}
.app.wide .nbtn .lbl{display:inline}
.app.wide .nbtn .car{display:inline;margin-left:auto;font-size:10px;opacity:.7}
.sub{display:none}
.app.wide .nitem.open .sub{display:block;padding:2px 0 6px}
.sub button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--side-ink);padding:6px 16px 6px 30px;font-size:12px;text-align:left}
.sub button:hover,.sub button.on{color:#fff}
.sub button svg.i{font-size:14px}
.fly{position:absolute;left:58px;top:0;min-width:170px;background:var(--side-2);border-radius:0 4px 4px 0;box-shadow:4px 6px 18px rgba(0,0,0,.25);display:none;z-index:40}
.app:not(.wide) .nitem:hover .fly{display:block}
.fly .fh{padding:11px 14px;color:#fff;font-weight:700;font-size:12.5px;background:var(--side)}
.fly button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--side-ink);padding:8px 14px;font-size:12px;text-align:left}
.fly button:hover{color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;background:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line)}
.ham{background:none;border:0;font-size:18px;color:#555d6e;padding:4px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;height:28px;padding:0 12px;width:150px;color:var(--faint);background:#fff}
.search input{border:0;outline:0;width:100%;font-size:12px;background:transparent}
.tright{margin-left:auto;display:flex;align-items:center;gap:14px;position:relative}
.callb{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;border:0}
.tg{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#555d6e;line-height:1.1}
.sw{width:30px;height:15px;border-radius:999px;background:#d7dae2;position:relative;border:0;padding:0;flex-shrink:0}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--indigo)}
.sw.on::after{left:17px}
.tlink{background:none;border:0;font-size:11.5px;color:#555d6e;padding:0}
.brandpill{display:flex;align-items:center;gap:4px;background:#eef0f6;border-radius:4px;padding:3px 8px;font-weight:800;font-size:12px;color:#2d3245}
.brandpill i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#5d6ce0,#4fc3f7);display:inline-block}
.bell{background:none;border:0;color:#555d6e;font-size:16px;padding:2px}
.user{background:none;border:0;font-size:12px;color:#3c4354;display:flex;align-items:center;gap:4px}
.dd{position:absolute;top:44px;right:0;background:#fff;border-radius:4px;box-shadow:0 8px 28px rgba(30,40,70,.16);z-index:50;padding:8px 0}
.dd.subs{right:90px;width:250px;padding:10px 14px;display:flex;flex-direction:column;gap:9px;max-height:70vh;overflow:auto}
.dd.subs .r{display:flex;gap:10px;align-items:center;font-size:12px;color:#4a5163}
.dd.subs .r.in{padding-left:12px}
.dd.subs .act{margin-top:4px;border:1px solid #9fb0f3;border-radius:4px;background:#fff;color:#5361d7;font-size:11px;padding:6px 8px}
.dd.user{width:150px}
.dd.user button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:7px 14px;font-size:12px;text-align:left}
.dd.user button:hover{background:#f5f6fa}
.content{padding:16px 20px 30px;flex:1;min-width:0}
.ptitle{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.ptitle h1{margin:0;font-size:14px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:#3a4152}
.crumb{font-size:12px;color:var(--muted)}
.panel{background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(40,50,80,.05);padding:16px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.b{border:0;border-radius:3px;height:28px;padding:0 12px;font-size:11.5px;font-weight:600;color:#fff;background:var(--blue);white-space:nowrap}
.b:hover{filter:brightness(.95)}
.b.red{background:var(--red)}.b.ind{background:var(--indigo)}.b.green{background:var(--green)}.b.ghost{background:#fff;color:#4655c8;border:1px solid #b6c0f2}
.b.sm{height:24px;padding:0 10px;font-size:11px}
.b:disabled{opacity:.55;cursor:not-allowed}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12px}
.t th{font-weight:700;text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;color:#3a4152;font-size:11.5px}
.t td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;color:#4a5163}
.t tr:hover td{background:#fafbfd}
.sorti{color:var(--faint);margin-right:3px}
.ok{color:var(--green);font-size:17px}.no{color:var(--red);font-size:17px}
.acts{display:flex;gap:6px;flex-wrap:nowrap}
.ab{width:26px;height:26px;border-radius:50%;border:0;color:#fff;background:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.ab.y{background:var(--amber)}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin:18px 0 0}
.tabs3 button{background:none;border:0;padding:8px;font-size:12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs3 button.on{color:var(--blue-d);border-bottom-color:var(--blue)}
.idlink{color:var(--indigo);font-weight:700;background:none;border:0;padding:0}
.chip{display:inline-block;border-radius:3px;padding:4px 8px;font-size:11px;font-weight:600;margin:2px 4px 2px 0;color:#3b3b14;white-space:nowrap}
.chip.y{background:var(--tag-y)}.chip.p{background:var(--tag-p);color:#6b2140}.chip.c{background:var(--tag-c);color:#124c4c}.chip.o{background:var(--tag-o);color:#5a2f00}
.eye{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;border:0;display:inline-flex;align-items:center;justify-content:center}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pager select{height:30px;border:1px solid var(--line);border-radius:4px;padding:0 8px;min-width:160px;background:#fff}
.pg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.pg span{padding:5px 10px;font-size:11.5px;color:var(--faint)}
.pg span.on{background:#5d6ce0;color:#fff}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:#555d6e}
.chk small{color:#ec7a33}
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px 16px;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:#4a5163}
.filters input,.filters select{height:30px;border:1px solid var(--line);border-radius:3px;padding:0 8px;background:#fff;font-size:12px;min-width:0}

/* credit card */
.card-grid{display:grid;grid-template-columns:300px minmax(0,1fr) minmax(0,.75fr);grid-template-areas:"left mid right" "left low low";grid-template-rows:auto 1fr;gap:16px;align-items:start}
.card-grid>.lp{grid-area:left}.card-grid>.midc{grid-area:mid}.card-grid>.rp{grid-area:right}.card-grid>.lower{grid-area:low;margin-top:0}
.lp{display:flex;flex-direction:column;gap:14px}
.cinfo{background:var(--lav);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:9px;font-size:12px;color:#2f3646}
.cinfo .hd{display:flex;justify-content:space-between;font-weight:700;font-size:12px}
.cinfo h2{margin:2px 0 0;font-size:17px;font-weight:800;letter-spacing:.01em;line-height:1.25}
.cinfo b{font-weight:700}
.cinfo .red{color:#e3343f;font-size:11.5px;display:flex;align-items:center;gap:4px}
.dia{color:#21b07a;font-size:10px}
.circ{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;border:0;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.circ.sm{width:20px;height:20px;font-size:11px}
.rowb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cinfo hr{border:0;border-top:1px solid #b9bfe9;margin:4px 0}
.cfin{background:#fff;border-radius:6px;padding:14px 16px;font-size:11.5px;color:#4a5163;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 4px rgba(40,50,80,.05)}
.kv{display:grid;grid-template-columns:118px 1fr;gap:3px 10px}
.kv span:nth-child(odd){color:#4a5163}
.kv span .g,.kv .g{color:var(--green-d)}
.kv span{min-width:0;overflow-wrap:anywhere}
.cfin hr{border:0;border-top:1px solid var(--line);margin:0}
.meta{display:flex;flex-direction:column;gap:7px;font-size:11px;color:var(--muted)}
.meta div{display:flex;gap:9px;align-items:flex-start}
.ptabs{display:flex;gap:4px;background:#fff;border-radius:6px 6px 0 0}
.pt{display:flex;align-items:center;gap:6px;height:30px;padding:0 14px;border:0;border-radius:4px;background:#fff;color:var(--blue);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;box-shadow:0 3px 10px rgba(82,168,236,.18)}
.pt svg.i{font-size:16px}
.pt.on{background:var(--blue);color:#fff}
.box{background:#fff;border-radius:6px;padding:14px;box-shadow:0 1px 4px rgba(40,50,80,.05);display:flex;flex-direction:column;gap:12px;min-width:0}
.frow{display:flex;align-items:center;gap:12px;font-size:12px}
.frow>span{width:70px;flex-shrink:0;font-weight:600}
.sel{height:30px;border:1px solid var(--line);border-radius:3px;padding:0 8px;background:#fff;width:100%;font-size:12px;min-width:0}
.sel.err{border-color:#f08a8f}
.errt{color:var(--red);font-size:11px;margin-top:-6px}
.ed{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ed .mb{display:flex;align-items:center;gap:12px;padding:6px 10px;font-size:11.5px;color:#4a5163}
.ed .mb .up{margin-left:auto;background:#fff1ee;color:#e0552e;border-radius:3px;padding:2px 7px;font-size:11px}
.ed .tb{display:flex;align-items:center;gap:14px;padding:4px 10px 8px;border-bottom:1px solid var(--line-2);font-size:13px;color:#4a5163;flex-wrap:wrap}
.ed .tb button{background:none;border:0;padding:0;font-size:13px}
.ed .tb .para{font-size:11.5px;display:flex;gap:16px;align-items:center}
.ed .area{min-height:150px;padding:10px 12px;outline:0;font-size:13px;line-height:1.5}
.ed .area:empty::before{content:attr(data-ph);color:var(--faint)}
.ed .ft{display:flex;justify-content:space-between;padding:4px 10px;font-size:11px;color:var(--faint);border-top:1px solid var(--line-2)}
.swl{display:flex;align-items:center;gap:8px;font-size:12px}
.clist{display:flex;flex-direction:column;gap:8px}
.cm{border:1px solid var(--line);border-radius:4px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.cm .h{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;gap:8px}
.cm .pin{color:var(--indigo);font-weight:700}
.shot{border:2px dashed #c6cbe0;border-radius:4px;min-height:70px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:10px;outline:0}
.shot.has{border-style:solid;border-color:var(--green)}
.shot img{max-height:120px;max-width:100%}
.lower{margin-top:16px;background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(40,50,80,.05);padding:12px 14px 16px;min-width:0}
.itabs{display:flex;flex-wrap:wrap;gap:6px 6px;margin-bottom:14px}
.it{height:30px;min-width:60px;padding:0 14px;border:0;border-radius:4px;background:#fff;color:var(--blue);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;box-shadow:0 3px 10px rgba(82,168,236,.2)}
.it svg.i{font-size:16px}
.it.on{background:var(--blue);color:#fff}
.acc{display:flex;flex-direction:column;gap:12px}
.acch{display:flex;align-items:center;gap:10px;background:#f6f7fa;border:0;border-radius:3px;padding:10px 12px;font-weight:800;font-size:12px;width:100%;text-align:left;color:#2f3646}
.acch .tri{color:var(--blue);font-size:10px}
.acch .okc{margin-left:auto;color:var(--green);font-size:16px}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 18px;padding:8px 4px 4px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:#4a5163}
.fgrid input,.fgrid select{height:30px;border:1px solid var(--line);border-radius:3px;padding:0 8px;background:#fff;font-size:12px;min-width:0;color:#4a5163}
.pcards{display:flex;flex-wrap:wrap;gap:12px;padding:6px 0}
.pcard{border:1px solid #9aa3e6;border-radius:3px;padding:8px 12px;text-align:center;font-size:11px;min-width:120px}
.docs{display:flex;flex-wrap:wrap;gap:12px}
.doc{width:110px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font-size:11px;color:#4a5163}
.doc .ph{width:110px;height:140px;border:1px solid #c8cde8;border-radius:4px;background:#ececf2;display:flex;align-items:center;justify-content:center;color:#b6bacb;font-size:34px;overflow:hidden}
.doc .ph.selfie{border-color:#9aa3e6}
.contacts{display:flex;flex-direction:column;gap:10px;font-size:12px}
.crow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.socials{display:flex;flex-direction:column;gap:6px;max-width:340px}
.socials input{height:30px;border:1px solid var(--line);border-radius:3px;padding:0 8px}
.actbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.actbar .b{background:#fff;color:#4655c8;border:1px solid #b6c0f2}
.actbar .b.green{background:var(--green-d);color:#fff;border-color:transparent}
.jr{display:flex;flex-direction:column;gap:0}
.jfil{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.jent{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:12px}
.jent .w{color:var(--muted);font-size:11px}
.pill{display:inline-block;border-radius:3px;padding:1px 7px;font-size:10.5px;font-weight:700;color:#fff;background:var(--indigo);margin-right:6px}
.pill.call{background:var(--green-d)}.pill.cd{background:#8a63d2}.pill.sms{background:var(--amber)}.pill.wo{background:var(--red)}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:12.5px}
.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;max-width:620px}
.form2 label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:#4a5163}
.form2 input,.form2 select{height:30px;border:1px solid var(--line);border-radius:3px;padding:0 8px;background:#fff;font-size:12px;min-width:0}
.hint{font-size:11.5px;color:var(--muted)}
.warn{background:#fff3f3;border:1px solid #f6c3c6;color:#b02a35;border-radius:4px;padding:8px 10px;font-size:12px}
.flag{display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-right:1px solid var(--line);height:100%;cursor:default;font-size:10px;color:var(--muted)}
.flag i{display:block;width:18px;height:12px;background:linear-gradient(#fff 0 33%,#1c57c8 33% 66%,#d52b1e 66%);box-shadow:0 0 0 1px #ddd}
.phonein{display:flex;align-items:center;height:32px;border:1px solid var(--line);border-radius:3px;background:#fff;flex:1;min-width:0}
.phonein input{border:0;outline:0;height:100%;flex:1;min-width:0;padding:0 8px;font-size:12px}
.modal-back{position:fixed;inset:0;background:rgba(30,35,50,.45);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:18px 16px;overflow:auto}
.modal{background:#fff;border-radius:6px;width:100%;max-width:740px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:calc(100vh - 36px)}
.modal.wide{max-width:900px}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;color:#3a4152}
.mh button{background:none;border:0;font-size:18px;line-height:1;color:#333;padding:2px 6px}
.mb2{padding:16px 20px;overflow:auto;display:flex;gap:18px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}

.chkl .bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,#4655e0 0 8px,#5d6cf0 8px 16px);color:#fff;font-size:8.5px;font-style:normal;text-align:center;line-height:12px}
.chkl .tp{border-top:1px solid var(--line);background:#fafbfc;padding:6px 10px;margin:6px -12px 0;display:flex;flex-direction:column;gap:6px;font-size:11.5px}
.chkl .tp div{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.chkl .bdg{font-size:10.5px;font-weight:700;color:#fff;border-radius:3px;padding:1px 6px;white-space:nowrap}
.chkl .bdg.g{background:#2fb66f}.chkl .bdg.o{background:#f2a33a}
.chkl .note{margin-top:12px;font-size:11.5px;color:var(--muted)}
@media (max-width:1180px){.cwrap{flex-direction:column}.chkl{width:auto;position:static}}

/* desktop */
.desk{position:fixed;inset:0;background:linear-gradient(160deg,#2b1d3a 0%,#7a3b4a 38%,#d9773f 70%,#f2b25c 100%);overflow:hidden;font-family:"Segoe UI",var(--f)}
.desk::after{content:"";position:absolute;left:-10%;right:-10%;bottom:var(--tbar);height:38%;background:radial-gradient(ellipse at 50% 100%,rgba(40,20,30,.55),transparent 70%);pointer-events:none}
.dicons{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:14px;z-index:1}
.dico{width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;font-size:12px;text-shadow:0 1px 2px rgba(0,0,0,.8);background:none;border:1px solid transparent;border-radius:3px;padding:6px 2px;cursor:default}
.dico.isel,.rico.isel{background:rgba(255,255,255,.28)!important;border-color:rgba(255,255,255,.55)!important}
.dico:hover,.dico:focus-visible{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.dico svg{width:46px;height:46px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.dhint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:#fff;text-align:center;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.7);max-width:520px;line-height:1.5;z-index:1}
.dhint b{font-size:20px;display:block;margin-bottom:6px}
.win{position:absolute!important;inset:0 0 var(--tbar) 0!important;z-index:5;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.win.hide{display:none!important}
.taskbar{position:absolute!important;left:0;right:0;bottom:0;z-index:20}
.taskbar .ti{cursor:default;border:0;background:none}
.taskbar .ti.open::after{content:"";position:absolute;bottom:2px;left:17px;right:17px;height:3px;border-radius:2px;background:#8a93a3}
.taskbar .ti.on::after{left:13px;right:13px;background:#0b63ce}
.taskbar .ti:hover{background:rgba(255,255,255,.6)}
/* new tab */
.ntp{min-height:100%;display:flex;flex-direction:column;align-items:center;padding-top:14vh;gap:26px;background:#fff}
.ntp .q{width:min(560px,90%);height:46px;border-radius:23px;border:1px solid #dfe1e5;display:flex;align-items:center;gap:12px;padding:0 18px;color:#70757a;font-size:14px;box-shadow:0 1px 6px rgba(32,33,36,.12)}
.ntp .tiles{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.ntp .tile{width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;color:#202124;background:none;border:0;border-radius:8px;padding:10px 4px}
.ntp .tile:hover{background:#f1f3f4}
.ntp .tile .ci{width:48px;height:48px;border-radius:50%;background:#f1f3f4;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
/* MicroSIP */
.sipw{position:absolute;width:300px;background:#f3f3f3;border:1px solid #8c8c8c;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:30;font-family:"Segoe UI",Tahoma,sans-serif;font-size:13px;color:#111;user-select:none}
.sipw[hidden]{display:none}
.sipw .tt{height:34px;display:flex;align-items:center;gap:8px;padding:0 0 0 10px;background:#fff;cursor:move}
.sipw .tt b{flex:1;font-weight:400;font-size:13.5px}
.sipw .tt button{width:42px;height:34px;border:0;background:none;font-size:13px}
.sipw .tt button:hover{background:#e5e5e5}.sipw .tt button.x:hover{background:#e81123;color:#fff}
.sipw .tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid #ccc;background:#f3f3f3}
.sipw .tabs button{border:1px solid transparent;border-bottom:0;background:none;padding:3px 6px;font-size:12.5px}
.sipw .tabs button.on{background:#fff;border-color:#ccc;margin-bottom:-1px}
.sipw .bd{padding:8px}
.sipw input.num{width:100%;height:36px;border:1px solid #7a7a7a;padding:0 8px;font-size:15px;background:#fff;box-sizing:border-box}
.sipw .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.sipw .kp button{height:40px;border:1px solid #d1d1d1;background:#fdfdfd;border-radius:3px;font-size:20px;text-align:left;padding:0 12px;display:flex;align-items:center;gap:4px}
.sipw .kp button small{font-size:9.5px;color:#666}
.sipw .kp button:hover{background:#eef4fb;border-color:#9cc3ec}
.sipw .kp button.c{justify-content:center;color:#555}
.sipw .crow{display:grid;grid-template-columns:44px 1fr 44px;gap:4px;margin-top:8px}
.sipw .crow button{height:42px;border:1px solid #d1d1d1;background:#e8e8e8;border-radius:3px;font-size:15px;color:#333}
.sipw .crow button.call{background:#dcdcdc}
.sipw .crow button.call.go{background:#2e9b4f;color:#fff;border-color:#2e9b4f}
.sipw .crow button.hang{background:#d93636;color:#fff;border-color:#c22}
.sipw .crow button.hang{background:#f04e37;border-color:#f04e37;font-size:16px}
.sipw .numsel{height:36px;border:1px solid #7a7a7a;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 8px;font-size:17px;white-space:nowrap;overflow:hidden}
.sipw .numsel span:first-child{overflow:hidden;text-overflow:ellipsis}
.sipw .vol i.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:22%;background:#1a73d9}.sipw .vol i.on.m::before{width:30%}
.sipw .vol{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#555}
.sipw .vol i{flex:1;height:14px;background:#e6e6e6;border:1px solid #ccc;position:relative}
.sipw .vol i::after{content:"";position:absolute;right:2px;top:-3px;width:6px;height:18px;background:#999}
.sipw .flags{display:flex;justify-content:center;gap:2px;margin-top:8px}
.sipw .flags span{padding:3px 6px;font-size:12px;color:#555}.sipw .flags span.on{background:#3d8bd9;color:#fff}
.sipw .sb{display:flex;align-items:center;gap:6px;border-top:1px solid #ccc;padding:5px 8px;font-size:12.5px;background:#f3f3f3}
.sipw .sb .dot{width:12px;height:12px;border-radius:50%;background:#2fb34a}
.sipw .sb .dot.busy{background:#e8a317}
.sipw .sb .ext{margin-left:auto;border-left:1px solid #ccc;padding-left:8px}
.sipw .callp{background:#fff;border:1px solid #cfd8e3;border-radius:3px;padding:10px;margin-top:8px;text-align:center}
.sipw .callp .n{font-size:17px;font-weight:600}
.sipw .callp .s{color:#555;font-size:12.5px;margin-top:2px}
.sipw .callp .tm{font-size:24px;font-variant-numeric:tabular-nums;margin-top:4px}
.sipw .rule{margin-top:6px;font-size:12px;border-radius:3px;padding:4px}
.sipw .rule.w{background:#fff3d6;color:#8a5a00}.sipw .rule.ok{background:#e1f5e6;color:#1d6b35}
.sipw .lg{max-height:330px;overflow:auto;font-size:12px}
.sipw .lg div{display:grid;grid-template-columns:54px 1fr auto;gap:6px;padding:5px 2px;border-bottom:1px solid #e2e2e2}
.sipw .lg .bad{color:#c22}.sipw .lg .ok{color:#1d7b3a}
.sipw.min .bd,.sipw.min .tabs,.sipw.min .sb{display:none}

/* sticky note from manager */
.dnote{position:absolute;right:24px;top:20px;width:250px;background:#fff8b8;color:#3b3300;border-radius:3px;box-shadow:0 6px 16px rgba(0,0,0,.3);padding:10px 12px 12px;font-size:12.5px;line-height:1.45;z-index:1;transform:rotate(1.2deg)}
.dnote b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7a6a00;margin-bottom:4px}
.dnote .wn{font-family:Consolas,monospace;font-size:15px;font-weight:700;color:#1a1600;user-select:text}
/* RDP window */
.rdpw{position:absolute;inset:0 0 var(--tbar) 0;z-index:4;display:flex;flex-direction:column;background:#000;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.rdpw.hide{display:none}
.rdpw .rtt{height:30px;flex-shrink:0;background:#1f3d68;color:#fff;display:flex;align-items:center;gap:8px;padding:0 0 0 10px;font-size:12.5px;user-select:none}
.rdpw .rtt b{font-weight:400;flex:1}
.rdpw .rtt .tool{background:#2f5a94;border:1px solid #4d7bbd;color:#fff;border-radius:3px;font-size:12px;padding:2px 10px;height:22px}
.rdpw .rtt .tool:hover{background:#3d6eb0}
.rdpw .rtt .wb{width:42px;height:30px;border:0;background:none;color:#fff;font-size:13px}
.rdpw .rtt .wb:hover{background:rgba(255,255,255,.15)}.rdpw .rtt .wb.x:hover{background:#e81123}
.rscr{flex:1;position:relative;overflow:hidden;background:linear-gradient(115deg,#0b6fd6 0%,#1386ea 45%,#0f74dc 100%);font-family:"Segoe UI",Arial,sans-serif;user-select:none}
.rscr .conn{position:absolute;inset:0;background:#0b2a4e;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:15px}
.rscr .spin2{width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rico{position:absolute;width:84px;text-align:center;color:#fff;font-size:12px;line-height:1.2;padding:5px 2px;border-radius:3px;text-shadow:0 1px 2px rgba(0,0,0,.6);background:none;border:1px solid transparent}
.rico:hover{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35)}
.rico .gl{width:44px;height:44px;margin:0 auto 4px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 20px Arial;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.rtb{position:absolute;left:0;right:0;bottom:0;height:34px;background:#1f2a36;display:flex;align-items:center;gap:6px;padding:0 8px;color:#fff;font-size:11px;z-index:40}
.rtb .rti{width:30px;height:28px;display:flex;align-items:center;justify-content:center;border-bottom:2px solid #7fb6ff;background:rgba(255,255,255,.08)}
.rtb .rti span{width:18px;height:18px;border-radius:4px;display:block}
.rtb .rcl{margin-left:auto;text-align:right;line-height:1.2}
/* Dolphin */
.dolw{position:absolute;left:3%;top:3%;width:88%;height:calc(94% - 34px);background:#fff;color:#1d2433;z-index:10;box-shadow:0 14px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;font-family:Roboto,"Segoe UI",Arial,sans-serif}
.dolw .dtt{height:28px;display:flex;align-items:center;gap:6px;padding:0 0 0 8px;font-size:12px;border-bottom:1px solid #eee;flex-shrink:0}
.dolw .dtt .dlg{width:16px;height:16px;border-radius:4px;background:#8b3fe6;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.dolw .dtt b{flex:1;font-weight:500}
.dolw .dtt button{width:38px;height:28px;border:0;background:none;color:#555}
.dolw .dtt button:hover{background:#eee}
.dspl{flex:1;background:linear-gradient(180deg,#b347ea,#9a2bc4);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.dspl .lg{display:flex;align-items:center;gap:14px;font-size:40px;font-weight:500}
.dspl .lg span{width:60px;height:60px;border-radius:14px;background:#fff;color:#a23fe0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:34px}
.dmain{flex:1;display:flex;min-height:0}
.drail{width:48px;border-right:1px solid #eef0f4;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:10px;color:#6b7280;font-size:15px}
.drail .dl{width:32px;height:32px;border-radius:9px;background:#8b3fe6;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.dbody{flex:1;min-width:0;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.dhead{display:flex;align-items:center;gap:10px}
.dhead h3{margin:0;font-size:19px;flex:1}
.dhead .cp{background:#1e6fd9;color:#fff;font-size:11.5px;font-weight:600;padding:8px 12px;border-radius:4px}
.dhead .ds{border:1px solid #d9dde4;border-radius:5px;height:32px;width:220px;display:flex;align-items:center;padding:0 8px;gap:6px;color:#9aa1ad}
.dhead .ds input{border:0;outline:0;font:13px Roboto,Arial,sans-serif;width:100%;color:#1d2433;background:transparent}
.dtbl{flex:1;border:1px solid #eef0f4;border-radius:6px;overflow-y:auto;font-size:13px}
.dtbl .h,.dtbl .r{display:grid;grid-template-columns:26px 1.4fr 1fr 1fr 110px;align-items:center;gap:8px;padding:0 12px}
.dtbl .h{height:34px;font-weight:600;font-size:11.5px;color:#374151;border-bottom:1px solid #eef0f4;position:sticky;top:0;background:#fff}
.dtbl .r{min-height:50px;border-bottom:1px solid #f1f2f5}
.dtbl .cb{width:14px;height:14px;border:1.5px solid #6b7280;border-radius:2px}
.dtbl .num{font-size:15px;font-family:Consolas,monospace}
.dtbl .st{border:1px solid #2fa84f;color:#2fa84f;border-radius:4px;font-size:11.5px;font-weight:700;padding:6px 0;text-align:center;background:#fff}
.dtbl .st.run{background:#2fa84f;color:#fff}
.dtbl .mut{color:#9aa1ad;font-size:12px}
/* Dolphin browser */
.dbr{position:absolute;left:1.5%;top:1.5%;width:96%;height:calc(97% - 34px);background:#fff;z-index:20;box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;font-family:Roboto,"Segoe UI",Arial,sans-serif;color:#111}
.dbr .tabs{height:32px;background:#dfe8f7;display:flex;align-items:flex-end;gap:6px;padding:0 0 0 8px;font-size:12px;flex-shrink:0}
.dbr .tab{background:#fff;border-radius:8px 8px 0 0;height:27px;width:230px;display:flex;align-items:center;gap:6px;padding:0 10px}
.dbr .tab i{width:12px;height:12px;border-radius:50%;background:#2aa3e0;display:block}
.dbr .tabs .wc{margin-left:auto;align-self:stretch;display:flex}
.dbr .tabs .wc button{width:40px;border:0;background:none;color:#444}
.dbr .tabs .wc button:hover{background:#c9d6ec}
.dbr .prof{align-self:center;background:#8b3fe6;color:#fff;border-radius:10px;font-size:11px;padding:2px 8px;margin-right:8px}
.dbr .addr{height:34px;display:flex;align-items:center;gap:12px;padding:0 10px;font-size:12.5px;color:#555;border-bottom:1px solid #e5e7eb;flex-shrink:0}
.dbr .addr .url{flex:1;background:#eef2f9;border-radius:16px;height:26px;display:flex;align-items:center;padding:0 12px;color:#222}
.dbr .bload{flex:1;display:flex;align-items:center;justify-content:center;color:#888;font-size:13px}
/* Telegram web */
.tgw{flex:1;display:flex;min-height:0;font-size:14px}
.tgw .lc{width:340px;border-right:1px solid #dadce0;display:flex;flex-direction:column;position:relative;min-height:0}
.tgw .lh{display:flex;align-items:center;gap:10px;padding:8px 12px}
.tgw .lh .ib{width:36px;height:36px;border-radius:50%;border:0;background:none;font-size:18px;color:#707579}
.tgw .lh .ib:hover{background:#f4f4f5}
.tgw .lh h4{margin:0;font-size:18px;font-weight:600;flex:1}
.tgw .sq{flex:1;height:40px;border-radius:20px;background:#f4f4f5;border:2px solid transparent;display:flex;align-items:center;padding:0 14px;gap:8px;color:#a2acb4}

.tgw .sq input{border:0;outline:0;background:transparent;font:14px Roboto,Arial,sans-serif;flex:1;color:#000;min-width:0}
.tgw .ls{flex:1;overflow-y:auto;padding:0 8px}
.tgw .ci{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;border:0;background:none;width:100%;text-align:left}
.tgw .ci:hover{background:#f4f4f5}.tgw .ci.on{background:#3390ec;color:#fff}.tgw .ci.on small,.tgw .ci.on .t{color:#e6f1fc}

.tgw .ci .m{flex:1;min-width:0}
.tgw .ci .m b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgw .ci .m small{display:block;color:#707579;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgw .ci .t{font-size:12px;color:#707579;align-self:flex-start;margin-top:4px}
.tgw .fab{position:absolute;right:18px;bottom:18px;width:54px;height:54px;border-radius:50%;background:#3390ec;color:#fff;border:0;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tgw .fab:hover{background:#1f7fdf}
.tgw .fmenu{position:absolute;right:18px;bottom:80px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.2);padding:6px 0;width:230px;z-index:3}
.tgw .fmenu button{display:flex;gap:14px;align-items:center;width:100%;border:0;background:none;padding:10px 18px;font-size:14px;text-align:left}
.tgw .fmenu button:hover{background:#f4f4f5}
.tgw .nf{padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.tgw .nf .bav{width:110px;height:110px;border-radius:50%;background:#3390ec;margin:6px auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px}
.tgw .fld{position:relative}
.tgw .fld input{width:100%;height:54px;border:1px solid #dadce0;border-radius:10px;padding:0 16px;font:15px Roboto,Arial,sans-serif;outline:0;color:#000;box-sizing:border-box}
.tgw .fld input:focus{border:2px solid #3390ec}
.tgw .fld label{position:absolute;left:12px;top:-8px;background:#fff;padding:0 4px;font-size:12px;color:#707579}
.tgw .rc{flex:1;display:flex;flex-direction:column;min-width:0;background:linear-gradient(160deg,#c9d99a,#8fbf8a 50%,#6aa98a);position:relative}
.tgw .rc::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 1.5px,transparent 1.5px);background-size:22px 22px;pointer-events:none}
.tgw .rc .pick{margin:auto;background:rgba(0,0,0,.25);color:#fff;border-radius:14px;padding:4px 12px;font-size:14px;position:relative}
.tgw .ch{height:56px;background:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;position:relative;z-index:1;flex-shrink:0}
.tgw .ch .av{width:40px;height:40px;flex-basis:40px;font-size:15px}
.tgw .ch b{display:block;font-weight:600}.tgw .ch small{color:#707579;font-size:13px}
.tgw .msgs{flex:1;overflow-y:auto;padding:14px 10%;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.tgw .msg{align-self:flex-end;background:#effdde;border-radius:14px 14px 4px 14px;padding:7px 11px 5px;max-width:70%;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tgw .msg small{display:block;text-align:right;font-size:11px;color:#4fae4e}
.tgw .tpl{display:flex;gap:6px;padding:0 10% 6px;flex-wrap:wrap;position:relative;z-index:1}
.tgw .tpl button{background:#fff;border:1px solid #cfe2f3;border-radius:14px;padding:4px 10px;font-size:12px;color:#2a7fd0}
.tgw .ib2{display:flex;gap:8px;align-items:flex-end;padding:0 10% 14px;position:relative;z-index:1}
.tgw .ib2 .bx{flex:1;background:#fff;border-radius:16px;display:flex;align-items:center;padding:6px 14px;min-height:46px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tgw .ib2 textarea{flex:1;border:0;outline:0;resize:none;font:15px Roboto,Arial,sans-serif;height:22px;color:#000;background:transparent}
.tgw .ib2 .snd{width:46px;height:46px;border-radius:50%;background:#3390ec;color:#fff;border:0;font-size:18px;flex:0 0 46px}
.shot .clipnote{display:block;font-size:11.5px;color:#2a7fd0;margin-top:4px}

/* modes */
.modes{position:absolute;inset:0;z-index:200;background:rgba(14,10,24,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modes[hidden]{display:none}
.mbox{background:#fff;border-radius:14px;max-width:880px;width:100%;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.4);color:#1d2433}
.mbox h2{margin:0 0 4px;font-size:24px}
.mbox .lead{color:#5b6474;margin:0 0 18px;font-size:14px}
.mcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mcard{border:2px solid #e3e6ee;border-radius:12px;padding:16px;text-align:left;background:#fff;display:flex;flex-direction:column;gap:8px;font-size:13px;color:#4b5363;line-height:1.45}
.mcard:hover{border-color:#5d6ce0;box-shadow:0 4px 14px rgba(93,108,224,.18)}
.mcard b{font-size:17px;color:#1d2433}
.mcard .n{width:34px;height:34px;border-radius:50%;background:#eef0fd;color:#4655c8;display:flex;align-items:center;justify-content:center;font-weight:800}
.mcard .go{margin-top:auto;align-self:flex-start;background:#5d6ce0;color:#fff;border-radius:6px;padding:6px 14px;font-weight:600}
.mhist{margin-top:18px;font-size:12.5px;color:#5b6474}
.mhist div{display:flex;justify-content:space-between;border-top:1px solid #eef0f4;padding:5px 0}
@media (max-width:760px){.mcards{grid-template-columns:1fr}}
.mpanel{position:absolute;left:12px;bottom:calc(var(--tbar) + 12px);width:330px;z-index:60;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:13px;color:#1d2433;overflow:hidden}
.mpanel[hidden]{display:none}
.mpanel .mh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#2f3646;color:#fff;font-size:12.5px;cursor:default}
.mpanel .mh b{flex:1;font-weight:600}
.mpanel .mh button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:4px;font-size:11.5px;padding:3px 8px}
.mpanel .mb{padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.mpanel .st{font-size:11px;color:#8a90a0;text-transform:uppercase;letter-spacing:.05em}
.mpanel h4{margin:0;font-size:15px}
.mpanel p{margin:0;line-height:1.5;color:#3a4152}
.mpanel .pb{height:6px;border-radius:3px;background:#eef0f4;overflow:hidden}.mpanel .pb i{display:block;height:100%;background:#5d6ce0}
.mpanel .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mpanel .btn{border:0;border-radius:6px;padding:7px 12px;font-weight:600;font-size:12.5px;background:#5d6ce0;color:#fff}
.mpanel .btn.g{background:#eef0f4;color:#3a4152}
.mpanel .kv{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px}
.mpanel.mini .mb{display:none}
.mpanel.alt{left:auto;right:330px;bottom:calc(var(--tbar) + 12px)}
.tour-hl{outline:3px solid #ffcf00!important;outline-offset:2px;box-shadow:0 0 0 6px rgba(255,207,0,.35)!important;animation:thl 1.2s ease-in-out infinite}
@keyframes thl{50%{outline-color:rgba(255,207,0,.35)}}
@media (prefers-reduced-motion:reduce){.tour-hl{animation:none}}
.res li{margin:4px 0}.res .ok{color:#1e8f4e}.res .no{color:#d23a3a}
.side .noff{cursor:default!important;pointer-events:none}

.cim .mh{justify-content:center;position:relative;font-size:22px;padding:16px}
.cim .mh button{position:absolute;right:14px;top:10px}
.cim .ph{text-align:center;font-size:20px;margin:6px 0 12px}
.cim .tgs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.cim h5{text-align:center;margin:14px 0 6px;font-size:14px}
.cim .t td,.cim .t th{font-size:12.5px}
.cim .open-id{color:#4655c8;font-weight:700;text-decoration:underline;background:none;border:0;padding:0;font:inherit}
.cim .cl-id{background:none;border:0;padding:0;font:inherit;color:inherit}

      if(!w.date[k]){ toast('«'+lab[k]+'»: обязательно укажите «Дату отмены списания»', 'bad'); return; }
      if(!(am>0)){ toast('«'+lab[k]+'»: введите сумму больше нуля', 'bad'); return; }

    var order = ['penalty','fine','commission','prolong','pct'];
    var after = function(k){ return woLeft(c, k) - (w.on[k] ? +String(w.am[k]||0).replace(',','.') : 0); };
    for(var j=0;j<sel.length;j++){ var t = sel[j], idx = order.indexOf(t); if(idx<2) continue;
      var prev = order.slice(0, idx).filter(function(p){ return after(p) > 0.001; });
      if(prev.length){ toast('Нарушен порядок: сначала полностью спишите «'+lab[prev[0]]+'» (порядок: пеня/штраф → комиссия за использование → комиссия за продление → проценты)', 'bad'); return; } }
    var d = new Date(); var at = d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
    sel.forEach(function(k){ c.writeoffs.push({id:1339000+c.writeoffs.length+Math.floor(Math.random()*900), type:k, label:lab[k], amount:+String(w.am[k]).replace(',','.'), by:ME, at:at, cancel:w.date[k].replace(/-/g,'.')}); });
    S.wo = null; S.modal = null; toast('Списано: '+sel.map(function(k){ return lab[k]+' − '+money(+String(c.writeoffs.filter(function(x){ return x.type===k; }).slice(-1)[0].amount))+' USDT'; }).join(', '), 'ok');
  }
};
